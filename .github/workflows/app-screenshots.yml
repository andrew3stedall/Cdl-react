name: App Screenshots

on:
  pull_request:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install browser test packages
        run: npm install --no-save playwright axe-core
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Start frontend preview
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 > ../vite-preview.log 2>&1 &
          echo $! > ../vite-preview.pid
      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat vite-preview.log
          exit 1
      - name: Test primary interactions
        run: |
          # The older player-pool/activity journey is retained as Market
          # coverage while Squad has its own dedicated browser journey below.
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/test-app-interactions.mjs")
          text = path.read_text(encoding="utf-8")
          old_route = "await page.goto(`${baseUrl}/squad-management`, { waitUntil: 'networkidle' });"
          new_route = "await page.goto(`${baseUrl}/scouting`, { waitUntil: 'networkidle' });"
          if old_route not in text:
              raise SystemExit("Legacy Squad route was not found")
          text = text.replace(old_route, new_route, 1)
          pattern = r"\n  const pitch = page\.locator\('section\[aria-label=\"Squad pitch\"\]'\);.*?\n  await pitch\.waitFor\(\);\n\n  await page\.getByRole\('tab'"
          replacement = "\n  await page.getByRole('tab'"
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Legacy Squad pitch block was not found")
          path.write_text(text, encoding="utf-8")
          PY
          node scripts/test-app-interactions.mjs
      - name: Test Squad workspace and Market persistence
        run: node scripts/test-squad-management-interactions.mjs
      - name: Test dashboard recovery
        run: node scripts/test-dashboard-recovery.mjs
      - name: Capture screenshots
        run: node scripts/capture-app-screenshots.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: artifacts/app-screenshots
          if-no-files-found: error