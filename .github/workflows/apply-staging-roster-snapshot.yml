name: Apply Staging Roster Snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/staging-operations/roster-snapshots/*.json'
      - '.github/staging-operations/apply_roster_snapshot.py'

permissions:
  contents: read
  id-token: write

concurrency:
  group: cdl-staging-roster-snapshot
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.repository == 'andrew3stedall/Cdl-react'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      PROJECT_ID: ${{ vars.GCP_STAGING_PROJECT_ID }}
      SNAPSHOT_CONFIRMATION: APPLY CASTLE ROSTER SNAPSHOT TO STAGING
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Identify the committed snapshot request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t request_files < <(
            git diff-tree --no-commit-id --name-only --diff-filter=AM -r "$GITHUB_SHA" |
              grep -E '^\.github/staging-operations/roster-snapshots/[^/]+\.json$' || true
          )
          if [[ "${#request_files[@]}" -gt 1 ]]; then
            echo "Expected no more than one roster snapshot JSON in this commit." >&2
            exit 1
          fi
          if [[ "${#request_files[@]}" -eq 1 ]]; then
            snapshot_path="${request_files[0]}"
          else
            snapshot_path="$(
              find .github/staging-operations/roster-snapshots -maxdepth 1 -type f -name '*.json' |
                sort | tail -n 1
            )"
          fi
          test -n "$snapshot_path"
          echo "path=$snapshot_path" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked
      - name: Validate staging destination
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = 'cdl-react-staging-ast'
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_STAGING_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Install verified Cloud SQL Auth Proxy
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.22.0/cloud-sql-proxy.linux.amd64 \
            --output "$RUNNER_TEMP/cloud-sql-proxy"
          echo "42e73a8775bc3300b6514816cc4893f01b109a50f65aa779a451d3e4ff4c3ead  $RUNNER_TEMP/cloud-sql-proxy" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/cloud-sql-proxy"
      - name: Reconcile screenshot roster allocation snapshot
        env:
          SNAPSHOT_PATH: ${{ steps.request.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          export CDL_DATABASE_URL="$(gcloud secrets versions access latest --secret=cdl-database-url --project="$PROJECT_ID")"
          "$RUNNER_TEMP/cloud-sql-proxy" --address=127.0.0.1 --port=5433 \
            cdl-react-staging-ast:australia-southeast1:cdl-react-staging-postgres \
            >"$RUNNER_TEMP/roster-proxy.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          uv run python -c 'import socket,time
          for attempt in range(30):
              try:
                  socket.create_connection(("127.0.0.1",5433),timeout=1).close()
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("Staging proxy did not become ready")'
          uv run python .github/staging-operations/apply_roster_snapshot.py "$SNAPSHOT_PATH" \
            --confirmation "$SNAPSHOT_CONFIRMATION"
