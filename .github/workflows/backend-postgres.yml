name: Backend PostgreSQL

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cdl
          POSTGRES_USER: cdl
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cdl -d cdl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CDL_DATABASE_URL: postgresql+psycopg://cdl@localhost:5432/cdl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - name: Capture Ruff format diagnostics
        run: uv run ruff format --diff . > ruff-format.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: historical-import-format-diagnostics
          path: ruff-format.txt
      - run: uv run alembic upgrade head
      - name: Test PostgreSQL release paths
        run: >-
          uv run pytest
          tests/test_postgres_league_api.py
          tests/test_postgres_dashboard_metrics.py
          tests/test_postgres_dashboard_config.py
          tests/test_postgres_dashboard_snapshots.py
          tests/test_postgres_fdr.py
          tests/test_historical_import_migration.py
          tests/test_historical_import_service.py
