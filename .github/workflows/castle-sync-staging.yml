name: Castle Sync Staging

on:
  # A merge of the diagnostic fix starts a read-only plan automatically.
  # Push runs have no inputs, so operation/projection below default to plan/archive.
  push:
    branches: [main]
    paths:
      - 'src/cdl_api/castle_sync.py'
      - 'src/cdl_api/repositories/castle_sync.py'
      - 'src/cdl_api/services/castle_source_adapter.py'
      - '.github/workflows/castle-sync-staging.yml'
      - '.github/staging-operations/castle-sync-requests/*.json'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [plan, apply]
        default: plan
        description: Plan never writes; apply requires the reviewed plan digest
      projection:
        type: choice
        options: [archive, native]
        default: archive
        description: Archive all source data; native also projects compatible app rows
      expected_plan:
        description: Copy plan_digest from the matching plan run (required for apply)
        default: ''
      confirmation:
        description: Type IMPORT CASTLE STAGING for apply
        default: ''
      source_league:
        description: Source league ID; leave empty only when exactly one is available
        default: ''
      team_aliases:
        description: JSON source team name to existing target team ID, only for reviewed aliases
        default: '{}'
      player_ids:
        description: JSON source element ID to existing target player ID, only for reviewed mappings
        default: '{}'
      trade_gameweeks:
        description: JSON source trade ID to known gameweek; never infer missing gameweeks
        default: '{}'
      adopt_existing:
        type: boolean
        default: false
        description: Allow first adoption of differing target fixture/lineup rows, backed up before change
      allow_gaps:
        type: boolean
        default: false
        description: Accept that reported unsupported data stays archived rather than native-projected
      native_entities:
        description: JSON array of native tables to project; empty means all supported native tables
        default: '[]'
      restore_missing:
        type: boolean
        default: false
        description: Recreate selected native rows whose target records were deleted
      lineup_gameweek:
        type: number
        default: 0
        description: Restrict native lineup projection to this current gameweek; zero keeps existing behavior
      replace_current_gameweek_synthetic:
        type: boolean
        default: false
        description: Replace lineup rows in the selected current gameweek after confirming their staging data is synthetic; backups are retained

permissions:
  contents: read
  id-token: write

concurrency:
  group: castle-staging-source-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      PROJECT_ID: ${{ vars.GCP_STAGING_PROJECT_ID }}
      CASTLE_EXPORT_DATA: 'true'
      CASTLE_EXPECTED_PLAN: ${{ inputs.expected_plan }}
      CASTLE_CONFIRM_APPLY: ${{ inputs.confirmation }}
      CASTLE_SOURCE_LEAGUE: ${{ inputs.source_league }}
      CASTLE_TEAM_ALIASES: ${{ inputs.team_aliases }}
      CASTLE_PLAYER_IDS: ${{ inputs.player_ids }}
      CASTLE_TRADE_GAMEWEEKS: ${{ inputs.trade_gameweeks }}
      CASTLE_ADOPT_EXISTING: ${{ inputs.adopt_existing }}
      CASTLE_ALLOW_GAPS: ${{ inputs.allow_gaps }}
      CASTLE_NATIVE_ENTITIES: ${{ inputs.native_entities || '[]' }}
      CASTLE_RESTORE_MISSING: ${{ inputs.restore_missing }}
      CASTLE_LINEUP_GAMEWEEK: ${{ inputs.lineup_gameweek }}
      CASTLE_REPLACE_CURRENT_GAMEWEEK_SYNTHETIC: ${{ inputs.replace_current_gameweek_synthetic }}
      SYNC_OPERATION: ${{ inputs.operation || 'plan' }}
      SYNC_PROJECTION: ${{ inputs.projection || 'archive' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked
      - name: Load committed sync request
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t request_files < <(
            git diff-tree --no-commit-id --name-only --diff-filter=AM -r "$GITHUB_SHA" |
              grep -F '.github/staging-operations/castle-sync-requests/' || true
          )
          if [[ "${#request_files[@]}" -eq 0 ]]; then
            echo "No Castle sync request in this push; keeping the read-only archive defaults."
            exit 0
          fi
          if [[ "${#request_files[@]}" -ne 1 ]]; then
            echo "A Castle sync push must change exactly one request JSON file." >&2
            exit 1
          fi
          request_file="${request_files[0]}"
          jq -e '(.operation == "plan" or .operation == "apply") and .projection == "native"' "$request_file" >/dev/null
          echo "SYNC_OPERATION=$(jq -er '.operation' "$request_file")" >> "$GITHUB_ENV"
          echo "CASTLE_EXPECTED_PLAN=$(jq -er '.expected_plan // ""' "$request_file")" >> "$GITHUB_ENV"
          echo "CASTLE_CONFIRM_APPLY=$(jq -er '.confirmation // ""' "$request_file")" >> "$GITHUB_ENV"
          echo "CASTLE_SOURCE_LEAGUE=$(jq -er '.source_league // ""' "$request_file")" >> "$GITHUB_ENV"
          echo "CASTLE_NATIVE_ENTITIES=$(jq -cer '.native_entities // [] | select(type == "array")' "$request_file")" >> "$GITHUB_ENV"
          echo "CASTLE_RESTORE_MISSING=$(jq -er '.restore_missing // false | select(type == "boolean")' "$request_file")" >> "$GITHUB_ENV"
          echo "CASTLE_LINEUP_GAMEWEEK=$(jq -er '.lineup_gameweek // 0 | select(type == "number")' "$request_file")" >> "$GITHUB_ENV"
          echo "CASTLE_REPLACE_CURRENT_GAMEWEEK_SYNTHETIC=$(jq -er '.replace_current_gameweek_synthetic // false | select(type == "boolean")' "$request_file")" >> "$GITHUB_ENV"
          echo 'SYNC_PROJECTION=native' >> "$GITHUB_ENV"
          echo 'CASTLE_TEAM_ALIASES={}' >> "$GITHUB_ENV"
          echo 'CASTLE_PLAYER_IDS={}' >> "$GITHUB_ENV"
          echo 'CASTLE_TRADE_GAMEWEEKS={}' >> "$GITHUB_ENV"
          echo 'CASTLE_ADOPT_EXISTING=true' >> "$GITHUB_ENV"
          echo 'CASTLE_ALLOW_GAPS=true' >> "$GITHUB_ENV"
          echo "Loaded Castle sync request $request_file."
      - name: Check boundary and apply confirmation before source access
        run: |
          test "$PROJECT_ID" = 'cdl-react-staging-ast'
          case "$SYNC_OPERATION" in plan|apply) ;; *) exit 1 ;; esac
          case "$SYNC_PROJECTION" in archive|native) ;; *) exit 1 ;; esac
          if [ "$SYNC_OPERATION" = apply ]; then
            test "$CASTLE_CONFIRM_APPLY" = 'IMPORT CASTLE STAGING'
            [[ "$CASTLE_EXPECTED_PLAN" =~ ^[a-f0-9]{64}$ ]]
          fi
      - name: Validate collectors
        run: node --test scripts/castle-inventory*.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_STAGING_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Fetch fresh Castle source snapshot without FPL
        run: CASTLE_SYNC_INPUT_PATH="$RUNNER_TEMP/castle-sync-input.json" node scripts/castle-inventory-gcp.mjs
      - name: Install verified Cloud SQL Auth Proxy
        run: |
          curl --fail --silent --show-error --location \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.22.0/cloud-sql-proxy.linux.amd64 \
            --output "$RUNNER_TEMP/cloud-sql-proxy"
          echo "42e73a8775bc3300b6514816cc4893f01b109a50f65aa779a451d3e4ff4c3ead  $RUNNER_TEMP/cloud-sql-proxy" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/cloud-sql-proxy"
      - name: Plan or apply transaction through staging proxy
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cloud-sql-proxy" --address=127.0.0.1 --port=5433 \
            cdl-react-staging-ast:australia-southeast1:cdl-react-staging-postgres \
            >"$RUNNER_TEMP/castle-proxy.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          uv run python -c 'import socket,time
          for attempt in range(30):
              try:
                  socket.create_connection(("127.0.0.1",5433),timeout=1).close()
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("Staging proxy did not become ready")'
          uv run python -m cdl_api.castle_sync --operation "$SYNC_OPERATION" --projection "$SYNC_PROJECTION"
      - name: Remove plaintext snapshot even on failure
        if: always()
        run: |
          python3 -c 'import os,pathlib; (pathlib.Path(os.environ["RUNNER_TEMP"])/"castle-sync-input.json").unlink(missing_ok=True)'
      - name: Retain report and encrypted evidence for three days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: castle-sync-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/castle-sync-report.json
            ${{ runner.temp }}/castle-sync-team-review.json
            ${{ runner.temp }}/castle-export/
          if-no-files-found: warn
          retention-days: 3
