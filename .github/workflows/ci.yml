name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  runtime-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production runtime image
        run: docker build --tag cdl-runtime-ci .
      - name: Verify Cloud Run job interpreter and package imports
        run: >-
          docker run --rm --entrypoint python cdl-runtime-ci
          -c "import sys; import cdl_api.migrate; import cdl_api.refresh_fpl;
          assert sys.executable.startswith('/app/.venv/'), sys.executable"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run test
      - run: npm run test:browser
      - run: npm run build
