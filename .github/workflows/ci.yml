name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - name: Capture frontend test diagnostics
        run: npm run test > frontend-test.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-test-diagnostics
          path: frontend/frontend-test.txt
      - run: npm run test
      - run: npm run build
