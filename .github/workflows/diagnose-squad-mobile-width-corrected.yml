name: Diagnose squad mobile width corrected

on:
  push:
    branches:
      - codex/squad-management-workspace-redesign
    paths:
      - .github/workflows/diagnose-squad-mobile-width-corrected.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/squad-management-workspace-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend and Playwright
        working-directory: frontend
        run: |
          npm install
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start frontend
        working-directory: frontend
        run: npm run dev -- --host 127.0.0.1 > ../vite-diagnostic.log 2>&1 &
      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0
            sleep 2
          done
          cat vite-diagnostic.log
          exit 1
      - name: Create width report
        working-directory: frontend
        run: |
          mkdir -p ../tmp
          node --input-type=module > ../tmp/squad-width-report.json <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
          const page = await context.newPage();
          await page.route('**/api/**', async (route) => {
            const request = route.request();
            const path = new URL(request.url()).pathname;
            if (path === '/api/auth/session') return route.fulfill({ json: { is_authenticated: true, user: { id: 'diagnostic', email: 'diagnostic@example.com', display_name: 'Diagnostic Manager', roles: ['manager'] }, expires_at: '2099-01-01T00:00:00Z' } });
            if (path === '/api/squad/summary') return route.fulfill({ json: { manager_team: { id: 'team-1', name: 'Exeter Gently' }, gameweek: { id: 'gw-1', name: 'Gameweek 1', number: 1 }, players: [{ id: 'player-1', display_name: 'Alex Keeper', position: 'GKP', epl_team: { name: 'Arsenal', short_name: 'ARS' }, status: 'owned', points: 48, value: 5.0 }] } });
            if (path === '/api/scouting/players') return route.fulfill({ json: { players: [{ id: 'player-1', display_name: 'Alex Keeper', position: 'GKP', epl_team: { name: 'Arsenal', short_name: 'ARS' }, status: 'owned', points: 48, value: 5.0 }] } });
            if (path === '/api/interests') return route.fulfill({ json: [] });
            if (path === '/api/trades') return route.fulfill({ json: { trades: [] } });
            if (path === '/api/contracts/theme-presets') return route.fulfill({ json: { presets: [] } });
            return route.fulfill({ json: {} });
          });
          await page.goto('http://127.0.0.1:5173/squad-management', { waitUntil: 'networkidle' });
          await page.getByRole('status').getByText('Exeter Gently loaded from staging PostgreSQL.', { exact: true }).waitFor();
          const report = await page.evaluate(() => {
            const selectors = ['html','body','#root','.app-shell','.shell-main','.shell-header','.session-card','.feature-screen','.squad-workspace','.squad-page-header','.squad-metric-grid','.squad-content-card','.squad-tabs','.squad-tab-panel','.squad-table-scroll','.squad-table'];
            const item = (selector) => {
              const element = document.querySelector(selector);
              if (!element) return { selector, missing: true };
              const rect = element.getBoundingClientRect();
              const style = getComputedStyle(element);
              return { selector, rect: { left: rect.left, right: rect.right, width: rect.width }, clientWidth: element.clientWidth, scrollWidth: element.scrollWidth, display: style.display, position: style.position, width: style.width, minWidth: style.minWidth, maxWidth: style.maxWidth, overflowX: style.overflowX, contain: style.contain, gridTemplateColumns: style.gridTemplateColumns };
            };
            const widest = [...document.querySelectorAll('*')]
              .map((element) => ({ element, rect: element.getBoundingClientRect() }))
              .sort((a,b) => b.rect.right - a.rect.right)
              .slice(0,20)
              .map(({element,rect}) => ({ tag: element.tagName, id: element.id, className: typeof element.className === 'string' ? element.className : '', left: rect.left, right: rect.right, width: rect.width, overflowX: getComputedStyle(element).overflowX, parentClass: typeof element.parentElement?.className === 'string' ? element.parentElement.className : '', parentClientWidth: element.parentElement?.clientWidth, parentScrollWidth: element.parentElement?.scrollWidth, parentOverflowX: element.parentElement ? getComputedStyle(element.parentElement).overflowX : null }));
            return { viewport: innerWidth, documentScrollWidth: document.documentElement.scrollWidth, bodyScrollWidth: document.body.scrollWidth, items: selectors.map(item), widest };
          });
          console.log(JSON.stringify(report, null, 2));
          await browser.close();
          JS
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tmp/squad-width-report.json
          git commit -m "Add temporary squad width diagnostic report"
          git push origin HEAD:codex/squad-management-workspace-redesign
