name: Diagnose squad mobile width

on:
  push:
    branches:
      - codex/squad-management-workspace-redesign
    paths:
      - .github/workflows/diagnose-squad-mobile-width.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/squad-management-workspace-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend and browser packages
        working-directory: frontend
        run: npm install
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 > ../vite-diagnostic.log 2>&1 &
          echo $! > ../vite-diagnostic.pid
      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat vite-diagnostic.log
          exit 1
      - name: Report mobile widths
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch();
          const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
          const page = await context.newPage();
          await page.route('**/api/**', async (route) => {
            const request = route.request();
            const path = new URL(request.url()).pathname;
            if (path === '/api/auth/session') {
              return route.fulfill({ json: {
                is_authenticated: true,
                user: { id: 'diagnostic', email: 'diagnostic@example.com', display_name: 'Diagnostic Manager', roles: ['manager'] },
                expires_at: '2099-01-01T00:00:00Z',
              } });
            }
            if (path === '/api/squad/summary') {
              return route.fulfill({ json: {
                manager_team: { id: 'team-1', name: 'Exeter Gently' },
                gameweek: { id: 'gw-1', name: 'Gameweek 1', number: 1 },
                players: [
                  { id: 'player-1', display_name: 'Alex Keeper', position: 'GKP', epl_team: { name: 'Arsenal', short_name: 'ARS' }, status: 'owned', points: 48, value: 5.0 },
                ],
              } });
            }
            if (path === '/api/scouting/players') {
              return route.fulfill({ json: { players: [
                { id: 'player-1', display_name: 'Alex Keeper', position: 'GKP', epl_team: { name: 'Arsenal', short_name: 'ARS' }, status: 'owned', points: 48, value: 5.0 },
                { id: 'player-3', display_name: 'Casey Midfielder', position: 'MID', epl_team: { name: 'Chelsea', short_name: 'CHE' }, status: 'available', points: 61, value: 7.5 },
              ] } });
            }
            if (path === '/api/interests') return route.fulfill({ json: [] });
            if (path === '/api/trades') return route.fulfill({ json: { trades: [] } });
            if (path === '/api/contracts/theme-presets') return route.fulfill({ json: { presets: [] } });
            return route.fulfill({ json: {} });
          });

          await page.goto('http://127.0.0.1:5173/squad-management', { waitUntil: 'networkidle' });
          await page.getByRole('status').getByText('Exeter Gently loaded from staging PostgreSQL.', { exact: true }).waitFor();

          const report = await page.evaluate(() => {
            const selectors = [
              'html', 'body', '.app-shell', '.shell-main', '.feature-screen', '.squad-workspace',
              '.squad-content-card', '.squad-tab-panel', '.squad-table-scroll', '.squad-table',
            ];
            const describe = (element) => {
              if (!element) return null;
              const rect = element.getBoundingClientRect();
              const style = getComputedStyle(element);
              return {
                selector: element.matches('html') ? 'html' : element.matches('body') ? 'body' : element.className || element.tagName,
                rect: { left: rect.left, right: rect.right, width: rect.width },
                clientWidth: element.clientWidth,
                offsetWidth: element.offsetWidth,
                scrollWidth: element.scrollWidth,
                display: style.display,
                width: style.width,
                minWidth: style.minWidth,
                maxWidth: style.maxWidth,
                overflowX: style.overflowX,
                contain: style.contain,
                gridTemplateColumns: style.gridTemplateColumns,
              };
            };
            const elements = selectors.map((selector) => ({ selector, value: describe(document.querySelector(selector)) }));
            const rightEdge = [...document.querySelectorAll('*')]
              .map((element) => ({ element, rect: element.getBoundingClientRect() }))
              .filter(({ rect }) => rect.right > window.innerWidth + 1 || rect.left < -1)
              .sort((a, b) => b.rect.right - a.rect.right)
              .slice(0, 15)
              .map(({ element, rect }) => ({
                tag: element.tagName,
                id: element.id,
                className: typeof element.className === 'string' ? element.className : '',
                rect: { left: rect.left, right: rect.right, width: rect.width },
                overflowX: getComputedStyle(element).overflowX,
                parent: element.parentElement ? {
                  tag: element.parentElement.tagName,
                  className: typeof element.parentElement.className === 'string' ? element.parentElement.className : '',
                  overflowX: getComputedStyle(element.parentElement).overflowX,
                  clientWidth: element.parentElement.clientWidth,
                  scrollWidth: element.parentElement.scrollWidth,
                } : null,
              }));
            return {
              viewport: window.innerWidth,
              documentScrollWidth: document.documentElement.scrollWidth,
              bodyScrollWidth: document.body.scrollWidth,
              elements,
              rightEdge,
            };
          });

          console.log(JSON.stringify(report, null, 2));
          await browser.close();
          JS
