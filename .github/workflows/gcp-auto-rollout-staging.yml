name: GCP Auto Rollout Staging

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "frontend/**"
      - "src/**"
      - "migrations/**"
      - "infra/terraform/environments/staging/**"
      - "infra/terraform/modules/**"
      - ".github/workflows/gcp-auto-rollout-staging.yml"
      - "tests/test_gcp_auto_rollout_staging.py"
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "frontend/**"
      - "src/**"
      - "migrations/**"
      - "infra/terraform/environments/staging/**"
      - "infra/terraform/modules/**"
      - ".github/workflows/gcp-auto-rollout-staging.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write


env:
  REGION: australia-southeast1
  ARTIFACT_REPOSITORY: cdl-react-backend
  IMAGE_NAME: cdl-react-app

jobs:
  validate:
    name: Validate automatic staging rollout
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform/environments/staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -recursive -check

      - name: Terraform init without backend
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

  rollout:
    name: Build, migrate, deploy, and refresh staging
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: cdl-staging-runtime-mutation
      cancel-in-progress: false
    environment: staging

    env:
      PROJECT_ID: ${{ vars.GCP_STAGING_PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.GCP_STAGING_PROJECT_NUMBER }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
      TERRAFORM_STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record rollout start
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Automatic staging rollout started for commit \`${GITHUB_SHA}\`: ${run_url}"
          gh api "repos/${GITHUB_REPOSITORY}/issues/96/comments" -f body="${body}"

      - name: Validate staging identity
        run: |
          set -euo pipefail
          test "${PROJECT_ID}" = "cdl-react-staging-ast"
          test -n "${PROJECT_NUMBER}"
          test -n "${TERRAFORM_STATE_BUCKET}"
          test "${WORKLOAD_IDENTITY_PROVIDER}" = \
            "projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          test "${DEPLOY_SERVICE_ACCOUNT}" = \
            "github-deploy@${PROJECT_ID}.iam.gserviceaccount.com"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"

      - name: Pin currently healthy revision during rollout
        run: |
          set -euo pipefail
          gcloud run services describe cdl-react-staging-api \
            --project "${PROJECT_ID}" --region "${REGION}" --format=json \
            > "${RUNNER_TEMP}/current-service.json"
          revision="$(python scripts/cloud_run_staged_revision.py pin "${RUNNER_TEMP}/current-service.json")"
          echo "RUNTIME_TRAFFIC_REVISION=${revision}" >> "${GITHUB_ENV}"

      - name: Diagnose recent staging auth failures
        continue-on-error: true
        run: |
          set +e
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="cdl-react-staging-api" AND httpRequest.requestUrl:"/api/auth/"' \
            --project "${PROJECT_ID}" \
            --freshness=12h \
            --limit=200 \
            --format=json > "${RUNNER_TEMP}/auth-requests.json" 2> "${RUNNER_TEMP}/auth-requests.err"
          request_rc=$?
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="cdl-react-staging-api" AND severity>=ERROR' \
            --project "${PROJECT_ID}" \
            --freshness=12h \
            --limit=200 \
            --format=json > "${RUNNER_TEMP}/service-errors.json" 2> "${RUNNER_TEMP}/service-errors.err"
          error_rc=$?
          set -e

          python - "${RUNNER_TEMP}/auth-requests.json" "${RUNNER_TEMP}/service-errors.json" "${request_rc}" "${error_rc}" <<'PY'
          import json
          import re
          import sys
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlsplit

          def load(path: str):
              try:
                  text = Path(path).read_text(encoding="utf-8").strip()
                  return json.loads(text) if text else []
              except Exception:
                  return []

          requests = load(sys.argv[1])
          errors = load(sys.argv[2])
          request_rc = int(sys.argv[3])
          error_rc = int(sys.argv[4])

          status_counts = Counter()
          recent = []
          for entry in requests:
              req = entry.get("httpRequest") or {}
              url = req.get("requestUrl") or ""
              path = urlsplit(url).path if url else ""
              if not path.startswith("/api/auth/"):
                  continue
              status = int(req.get("status") or 0)
              status_counts[(path, status)] += 1
              recent.append((entry.get("timestamp", ""), path, status, (entry.get("resource") or {}).get("labels", {}).get("revision_name", "")))

          safe_frames = []
          exception_summaries = []
          exception_classes = Counter()
          frame_re = re.compile(r'File "(/app/[^\"]+)", line (\d+), in ([^\s]+)')
          exc_line_re = re.compile(r"^([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception))(?::\s*(.*))?$")
          email_re = re.compile(r"[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}", re.I)
          url_re = re.compile(r"(?:postgresql|postgres|https?)://\S+", re.I)
          token_re = re.compile(r"\b[A-Za-z0-9_-]{40,}\b")
          quoted_re = re.compile(r"(['\"])[^'\"]{8,}\1")

          def sanitize(message: str) -> str:
              message = email_re.sub("<redacted-email>", message)
              message = url_re.sub("<redacted-url>", message)
              message = token_re.sub("<redacted-token>", message)
              message = quoted_re.sub("<redacted-value>", message)
              return message[:240]

          for entry in errors:
              pieces = []
              text = entry.get("textPayload")
              if isinstance(text, str):
                  pieces.append(text)
              payload = entry.get("jsonPayload")
              if isinstance(payload, dict):
                  for key in ("message", "exception", "stack_trace", "stackTrace"):
                      value = payload.get(key)
                      if isinstance(value, str):
                          pieces.append(value)
              combined = "\n".join(pieces)
              for match in frame_re.finditer(combined):
                  frame = f"{match.group(1)}:{match.group(2)} in {match.group(3)}"
                  if frame not in safe_frames:
                      safe_frames.append(frame)
              for line in combined.splitlines():
                  match = exc_line_re.match(line.strip())
                  if not match:
                      continue
                  name = match.group(1)
                  exception_classes[name] += 1
                  summary = f"{name}: {sanitize(match.group(2) or '')}".rstrip()
                  if summary not in exception_summaries:
                      exception_summaries.append(summary)

          print("AUTH_DIAGNOSTIC_BEGIN")
          print(f"logging_read_rc requests={request_rc} errors={error_rc}")
          for (path, status), count in sorted(status_counts.items()):
              print(f"auth_status path={path} status={status} count={count}")
          for timestamp, path, status, revision in sorted(recent, reverse=True)[:20]:
              print(f"auth_recent timestamp={timestamp} path={path} status={status} revision={revision}")
          for name, count in exception_classes.most_common():
              print(f"exception_class name={name} count={count}")
          for summary in exception_summaries[-20:]:
              print(f"exception_summary {summary}")
          for frame in safe_frames[-40:]:
              print(f"trace_frame {frame}")
          print("AUTH_DIAGNOSTIC_END")
          PY

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable application image
        run: |
          set -euo pipefail
          image_uri="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          if gcloud artifacts docker images describe "${image_uri}" \
            --project "${PROJECT_ID}" \
            --format='value(image_summary.digest)' >/dev/null 2>&1; then
            echo "Immutable image already exists; reusing ${image_uri}."
          else
            docker build --pull --tag "${image_uri}" .
            docker push "${image_uri}"
          fi
          digest="$(
            gcloud artifacts docker images describe "${image_uri}" \
              --project "${PROJECT_ID}" \
              --format='value(image_summary.digest)'
          )"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_digest_uri="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}@${digest}"
          echo "IMAGE_DIGEST_URI=${image_digest_uri}" >> "${GITHUB_ENV}"
          printf 'source_sha=%s\nimage_digest_uri=%s\n' \
            "${GITHUB_SHA}" "${image_digest_uri}" \
            > "${RUNNER_TEMP}/staging-image-reference.txt"

      - name: Terraform init with remote backend
        working-directory: infra/terraform/environments/staging
        run: terraform init -input=false

      - name: Create automatic staging plan
        id: plan
        working-directory: infra/terraform/environments/staging
        run: |
          set +e
          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -detailed-exitcode \
            -out="${RUNNER_TEMP}/auto-rollout.tfplan" \
            -var="project_id=${PROJECT_ID}" \
            -var="enable_database_jobs=true" \
            -var="enable_scheduled_fpl_refresh=true" \
            -var="enable_cloud_run=true" \
            -var="enable_google_sign_in=true" \
            -var="backend_image=${IMAGE_DIGEST_URI}" \
            -var="runtime_traffic_revision=${RUNTIME_TRAFFIC_REVISION}" \
            -var="allow_public_invoker=true"
          exit_code=$?
          set -e
          if [ "${exit_code}" -eq 1 ]; then
            echo "Terraform plan failed." >&2
            exit 1
          fi
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"

      - name: Render and gate automatic staging plan
        working-directory: infra/terraform/environments/staging
        run: |
          set -euo pipefail
          terraform show -no-color "${RUNNER_TEMP}/auto-rollout.tfplan" \
            > "${RUNNER_TEMP}/auto-rollout-plan.txt"
          terraform show -json "${RUNNER_TEMP}/auto-rollout.tfplan" \
            > "${RUNNER_TEMP}/auto-rollout-plan.json"
          set +e
          python "${GITHUB_WORKSPACE}/src/cdl_api/terraform_plan_summary.py" \
            --plan-json "${RUNNER_TEMP}/auto-rollout-plan.json" \
            --plan-file "${RUNNER_TEMP}/auto-rollout.tfplan" \
            --output "${RUNNER_TEMP}/auto-rollout-plan-summary.md" \
            --plan-exit-code "${{ steps.plan.outputs.exit_code }}" \
            --allow-staging-public-invoker
          summary_rc=$?
          set -e
          python - "${RUNNER_TEMP}/auto-rollout-plan.json" "${GITHUB_WORKSPACE}" <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path(sys.argv[2]) / "src"))
          from cdl_api.terraform_plan_summary import _parse_changes

          plan = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for item in _parse_changes(plan, "resource_drift"):
              if item["action"] not in {"no-op", "read"}:
                  print(
                      "Terraform drift paths: "
                      f"address={item['address']} paths={item['changed_paths']}"
                  )
          PY
          cat "${RUNNER_TEMP}/auto-rollout-plan-summary.md"
          if [ "${summary_rc}" -ne 0 ]; then
            echo "Terraform plan summary failed with exit code ${summary_rc}." >&2
            exit "${summary_rc}"
          fi
          grep -Fq "Safety gate: **PASS**" \
            "${RUNNER_TEMP}/auto-rollout-plan-summary.md"

      - name: Restrict automatic Terraform changes to the staging rollout allowlist
        run: |
          set -euo pipefail
          python - "${RUNNER_TEMP}/auto-rollout-plan.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          plan = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          allowed = {
              "google_cloud_run_v2_job.database_migration[0]": {("update",)},
              "google_cloud_run_v2_job.synthetic_seed[0]": {("update",)},
              "google_cloud_run_v2_job.fpl_refresh[0]": {("create",), ("update",)},
              "google_cloud_run_v2_job_iam_member.fpl_refresh_scheduler_invoker[0]": {
                  ("create",),
                  ("update",),
              },
              "google_cloud_scheduler_job.fpl_refresh[0]": {("create",), ("update",)},
              "google_project_iam_member.github_deploy_scheduler_admin": {
                  ("create",),
                  ("update",),
              },
              "google_project_service.required[\"cloudscheduler.googleapis.com\"]": {
                  ("create",),
                  ("update",),
              },
              "module.cloud_run_api[0].google_cloud_run_v2_service.this": {("update",)},
              "google_secret_manager_secret_iam_member.migration_google_allowed_emails_access": {
                  ("create",),
              },
              'google_secret_manager_secret_iam_member.github_deploy_candidate_smoke_secret_access["cdl-development-login-secret"]': {
                  ("create",),
              },
              'google_secret_manager_secret_iam_member.github_deploy_candidate_smoke_secret_access["cdl-google-allowed-emails"]': {
                  ("create",),
              },
          }
          unexpected = []
          for resource in plan.get("resource_changes", []):
              actions = tuple(resource.get("change", {}).get("actions", []))
              if actions in {("no-op",), ("read",)}:
                  continue
              address = resource.get("address", "<unknown>")
              if address not in allowed or actions not in allowed[address]:
                  unexpected.append({"address": address, "actions": actions})
          if unexpected:
              raise SystemExit(
                  "Automatic staging rollout contains non-allowlisted changes: "
                  + json.dumps(unexpected, sort_keys=True)
              )
          PY

      - name: Apply exact automatic staging plan
        working-directory: infra/terraform/environments/staging
        run: terraform apply -input=false "${RUNNER_TEMP}/auto-rollout.tfplan"

      - name: Verify post-apply no-change state
        working-directory: infra/terraform/environments/staging
        run: |
          set +e
          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -detailed-exitcode \
            -out="${RUNNER_TEMP}/post-rollout.tfplan" \
            -var="project_id=${PROJECT_ID}" \
            -var="enable_database_jobs=true" \
            -var="enable_scheduled_fpl_refresh=true" \
            -var="enable_cloud_run=true" \
            -var="enable_google_sign_in=true" \
            -var="backend_image=${IMAGE_DIGEST_URI}" \
            -var="runtime_traffic_revision=${RUNTIME_TRAFFIC_REVISION}" \
            -var="allow_public_invoker=true"
          exit_code=$?
          set -e
          if [ "${exit_code}" -ne 0 ]; then
            echo "Post-rollout Terraform plan was not a clean no-change result." >&2
            exit 1
          fi

      - name: Resolve applied resource names
        working-directory: infra/terraform/environments/staging
        run: |
          set -euo pipefail
          echo "MIGRATION_JOB=$(terraform output -raw database_migration_job_name)" >> "${GITHUB_ENV}"
          echo "SYNTHETIC_SEED_JOB=$(terraform output -raw synthetic_seed_job_name)" >> "${GITHUB_ENV}"
          echo "FPL_REFRESH_JOB=$(terraform output -raw fpl_refresh_job_name)" >> "${GITHUB_ENV}"
          echo "FPL_REFRESH_SCHEDULE=$(terraform output -raw fpl_refresh_schedule_name)" >> "${GITHUB_ENV}"
          echo "SERVICE_URL=$(terraform output -raw cloud_run_api_url)" >> "${GITHUB_ENV}"

      - name: Verify immutable job images
        run: |
          set -euo pipefail
          for job in "${MIGRATION_JOB}" "${SYNTHETIC_SEED_JOB}" "${FPL_REFRESH_JOB}"; do
            image="$(
              gcloud run jobs describe "${job}" \
                --project "${PROJECT_ID}" \
                --region "${REGION}" \
                --format='value(spec.template.spec.template.spec.containers[0].image)'
            )"
            test "${image}" = "${IMAGE_DIGEST_URI}"
          done

      - name: Run database migrations
        id: database-migrations
        continue-on-error: true
        run: |
          set -uo pipefail
          output_file="${RUNNER_TEMP}/migration-execution.txt"
          set +e
          gcloud run jobs execute "${MIGRATION_JOB}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --wait 2>&1 | tee "${output_file}"
          status=${PIPESTATUS[0]}
          set -e
          execution="$(sed -n 's/.*gcloud run jobs executions describe \([^[:space:]]*\).*/\1/p' "${output_file}" | tail -n 1)"
          echo "execution=${execution}" >> "${GITHUB_OUTPUT}"
          exit "${status}"

      - name: Tag and warm zero-percent candidate before readiness verification
        if: steps.database-migrations.outcome == 'success'
        run: |
          set -euo pipefail
          gcloud run services describe cdl-react-staging-api \
            --project "${PROJECT_ID}" --region "${REGION}" --format=json \
            > "${RUNNER_TEMP}/candidate-service.json"
          created="$(python scripts/cloud_run_staged_revision.py created \
            "${RUNNER_TEMP}/candidate-service.json")"
          if [ -z "${created}" ] || [ "${created}" = "${RUNTIME_TRAFFIC_REVISION}" ]; then
            echo "Cloud Run has not created a new candidate revision." >&2
            exit 1
          fi
          gcloud run revisions describe "${created}" \
            --project "${PROJECT_ID}" --region "${REGION}" --format=json \
            > "${RUNNER_TEMP}/staged-revision.json"
          CANDIDATE_REVISION="$(python scripts/cloud_run_staged_revision.py candidate \
            "${RUNNER_TEMP}/candidate-service.json" "${RUNNER_TEMP}/staged-revision.json" \
            "${RUNTIME_TRAFFIC_REVISION}" "${IMAGE_DIGEST_URI}")"
          CANDIDATE_TAG="cdl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CANDIDATE_REVISION=${CANDIDATE_REVISION}" >> "${GITHUB_ENV}"
          echo "CANDIDATE_TAG=${CANDIDATE_TAG}" >> "${GITHUB_ENV}"
          gcloud run services update-traffic cdl-react-staging-api \
            --project "${PROJECT_ID}" --region "${REGION}" \
            --update-tags="${CANDIDATE_TAG}=${CANDIDATE_REVISION}" --quiet
          gcloud run services describe cdl-react-staging-api \
            --project "${PROJECT_ID}" --region "${REGION}" --format=json \
            > "${RUNNER_TEMP}/candidate-service.json"
          candidate_url="$(python scripts/cloud_run_staged_revision.py candidate-url \
            "${RUNNER_TEMP}/candidate-service.json" "${CANDIDATE_REVISION}" \
            "${RUNTIME_TRAFFIC_REVISION}" "${CANDIDATE_TAG}")"
          echo "CANDIDATE_URL=${candidate_url}" >> "${GITHUB_ENV}"
          health_ready=false
          for attempt in $(seq 1 12); do
            status_code="$(curl --connect-timeout 5 --max-time 20 --silent \
              --output /dev/null --write-out '%{http_code}' \
              "${candidate_url}/health" || true)"
            if [ "${status_code}" = "200" ]; then
              health_ready=true
              break
            fi
            if [ "${attempt}" -lt 12 ]; then
              sleep 5
            fi
          done
          if [ "${health_ready}" != "true" ]; then
            echo "Candidate health endpoint did not respond with HTTP 200 within 12 bounded checks." >&2
            exit 1
          fi
          echo "Candidate health wakeup passed without changing the 100% serving revision."

      - name: Verify new revision before traffic promotion
        if: steps.database-migrations.outcome == 'success'
        run: |
          set -euo pipefail
          STAGED_REVISION=""
          for attempt in $(seq 1 60); do
            gcloud run services describe cdl-react-staging-api \
              --project "${PROJECT_ID}" --region "${REGION}" --format=json \
              > "${RUNNER_TEMP}/staged-service.json"
            ready="$(python scripts/cloud_run_staged_revision.py ready \
              "${RUNNER_TEMP}/staged-service.json" "${RUNTIME_TRAFFIC_REVISION}")"
            if [ -n "${ready}" ]; then
              if [ "${ready}" != "${CANDIDATE_REVISION}" ]; then
                echo "Ready revision does not match the validated candidate." >&2
                exit 1
              fi
              gcloud run revisions describe "${ready}" \
                --project "${PROJECT_ID}" --region "${REGION}" --format=json \
                > "${RUNNER_TEMP}/staged-revision.json"
              if ! STAGED_REVISION="$(python scripts/cloud_run_staged_revision.py verify \
                "${RUNNER_TEMP}/staged-service.json" "${RUNNER_TEMP}/staged-revision.json" \
                "${RUNTIME_TRAFFIC_REVISION}" "${IMAGE_DIGEST_URI}" \
                2>"${RUNNER_TEMP}/staged-revision-verification-error.txt")"; then
                cat "${RUNNER_TEMP}/staged-revision-verification-error.txt" >&2
                exit 1
              fi
              break
            fi
            if [ "$(python scripts/cloud_run_staged_revision.py failed \
              "${RUNNER_TEMP}/staged-service.json")" = "true" ]; then
              python scripts/cloud_run_staged_revision.py diagnostics \
                "${RUNNER_TEMP}/staged-service.json" - \
                "${RUNTIME_TRAFFIC_REVISION}" "${IMAGE_DIGEST_URI}" \
                > "${RUNNER_TEMP}/staged-revision-diagnostics.json"
              cat "${RUNNER_TEMP}/staged-revision-diagnostics.json" >&2
              echo "Cloud Run reports a terminal staged revision failure." >&2
              exit 1
            fi
            if [ "$(python scripts/cloud_run_staged_revision.py reconciling \
              "${RUNNER_TEMP}/staged-service.json")" = "false" ]; then
              python scripts/cloud_run_staged_revision.py diagnostics \
                "${RUNNER_TEMP}/staged-service.json" - \
                "${RUNTIME_TRAFFIC_REVISION}" "${image}" \
                > "${RUNNER_TEMP}/staged-revision-diagnostics.json"
              cat "${RUNNER_TEMP}/staged-revision-diagnostics.json" >&2
              echo "Cloud Run reconciliation ended without a new ready revision." >&2
              exit 1
            fi
            sleep 5
          done
          if [ -z "${STAGED_REVISION}" ]; then
            python scripts/cloud_run_staged_revision.py diagnostics \
              "${RUNNER_TEMP}/staged-service.json" - \
              "${RUNTIME_TRAFFIC_REVISION}" "${IMAGE_DIGEST_URI}" \
              > "${RUNNER_TEMP}/staged-revision-diagnostics.json"
            cat "${RUNNER_TEMP}/staged-revision-diagnostics.json" >&2
            echo "Cloud Run did not report a new ready revision within 60 checks." >&2
            exit 1
          fi
          echo "STAGED_REVISION=${STAGED_REVISION}" >> "${GITHUB_ENV}"
          echo "Verified staged revision ${STAGED_REVISION}; serving revision remains ${RUNTIME_TRAFFIC_REVISION}."

      - name: Smoke staged revision before traffic promotion
        if: steps.database-migrations.outcome == 'success'
        run: |
          set -euo pipefail
          test -n "${CANDIDATE_TAG}"
          gcloud run services describe cdl-react-staging-api \
            --project "${PROJECT_ID}" --region "${REGION}" --format=json \
            > "${RUNNER_TEMP}/candidate-service.json"
          candidate_url="$(python scripts/cloud_run_staged_revision.py candidate-url \
            "${RUNNER_TEMP}/candidate-service.json" "${STAGED_REVISION}" \
            "${RUNTIME_TRAFFIC_REVISION}" "${CANDIDATE_TAG}")"
          test -n "${candidate_url}"
          test "${candidate_url}" = "${CANDIDATE_URL}"
          curl --fail --silent --show-error "${candidate_url}/health" \
            | grep -Fq '"status":"ok"'
          status_code="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' "${candidate_url}/api/fpl/status")"
          test "${status_code}" = "401"

          gcloud secrets versions access latest \
            --project "${PROJECT_ID}" \
            --secret cdl-google-allowed-emails \
            > "${RUNNER_TEMP}/candidate-reviewer-emails.txt"
          gcloud secrets versions access latest \
            --project "${PROJECT_ID}" \
            --secret cdl-development-login-secret \
            > "${RUNNER_TEMP}/candidate-login-secret.txt"
          chmod 600 \
            "${RUNNER_TEMP}/candidate-reviewer-emails.txt" \
            "${RUNNER_TEMP}/candidate-login-secret.txt"
          python src/cdl_api/staging_candidate_smoke.py \
            --base-url "${candidate_url}" \
            --reviewer-emails-file "${RUNNER_TEMP}/candidate-reviewer-emails.txt" \
            --login-secret-file "${RUNNER_TEMP}/candidate-login-secret.txt"

      - name: Promote staged revision after migration
        if: steps.database-migrations.outcome == 'success'
        run: |
          set -euo pipefail
          gcloud run services update-traffic cdl-react-staging-api \
            --project "${PROJECT_ID}" --region "${REGION}" \
            --to-revisions "${STAGED_REVISION}=100" --quiet

      - name: Diagnose database migration failure
        if: steps.database-migrations.outcome == 'failure'
        run: |
          set -euo pipefail
          execution="${{ steps.database-migrations.outputs.execution }}"
          if [ -z "${execution}" ]; then
            echo "Cloud Run did not report a migration execution name." >&2
            exit 1
          fi
          gcloud run jobs executions describe "${execution}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='yaml(status.conditions,status.failedCount,status.logUri)'
          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${MIGRATION_JOB}\" AND labels.\"run.googleapis.com/execution_name\"=\"${execution}\"" \
            --project "${PROJECT_ID}" \
            --freshness=1h \
            --limit=100 \
            --format='value(timestamp,textPayload,jsonPayload.message)' \
            | sed -E 's#(postgresql|postgres|https?)://[^[:space:]]+#<redacted-url>#g; s/[A-Za-z0-9_-]{40,}/<redacted-token>/g'
          exit 1

      - name: Refresh official FPL data
        run: |
          set -euo pipefail
          gcloud run jobs execute "${FPL_REFRESH_JOB}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --wait

      - name: Verify deadline settlement schedule
        run: |
          set -euo pipefail
          test "$(gcloud scheduler jobs describe "${FPL_REFRESH_SCHEDULE}" \
            --project "${PROJECT_ID}" \
            --location "${REGION}" \
            --format='value(schedule)')" = "*/5 * * * *"

      - name: Verify live service and authentication boundary
        run: |
          set -euo pipefail
          test -n "${SERVICE_URL}"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "${SERVICE_URL}/health" \
              > "${RUNNER_TEMP}/health.json"; then
              break
            fi
            if [ "${attempt}" -eq 20 ]; then
              echo "Staging health endpoint did not become ready." >&2
              exit 1
            fi
            sleep 5
          done
          grep -Fq '"status":"ok"' "${RUNNER_TEMP}/health.json"
          status_code="$(
            curl --silent --show-error \
              --output "${RUNNER_TEMP}/fpl-status-unauthenticated.json" \
              --write-out '%{http_code}' \
              "${SERVICE_URL}/api/fpl/status"
          )"
          test "${status_code}" = "401"

      - name: Capture safe staged revision diagnostics
        if: always()
        run: |
          set -euo pipefail
          service_json="${RUNNER_TEMP}/staged-service.json"
          revision_json="${RUNNER_TEMP}/staged-revision.json"
          [ -f "${service_json}" ] || printf '{}\n' > "${service_json}"
          if [ ! -f "${revision_json}" ]; then
            revision_json="-"
          fi
          if ! python scripts/cloud_run_staged_revision.py diagnostics \
            "${service_json}" "${revision_json}" \
            "${RUNTIME_TRAFFIC_REVISION:-}" "${IMAGE_DIGEST_URI:-}" \
            > "${RUNNER_TEMP}/staged-revision-diagnostics.json" 2>/dev/null; then
            printf '{"diagnosticStatus":"unavailable"}\n' \
              > "${RUNNER_TEMP}/staged-revision-diagnostics.json"
          fi
          created="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("latestCreatedRevision") or "")' \
            "${RUNNER_TEMP}/staged-revision-diagnostics.json")"
          if [ -n "${created}" ] && [ "${created}" != "${RUNTIME_TRAFFIC_REVISION:-}" ]; then
            if gcloud run revisions describe "${created}" \
              --project "${PROJECT_ID}" --region "${REGION}" --format=json \
              > "${RUNNER_TEMP}/created-revision.json" 2>/dev/null; then
              if ! python scripts/cloud_run_staged_revision.py diagnostics \
                "${service_json}" "${RUNNER_TEMP}/created-revision.json" \
                "${RUNTIME_TRAFFIC_REVISION:-}" "${IMAGE_DIGEST_URI:-}" \
                > "${RUNNER_TEMP}/staged-revision-diagnostics.json" 2>/dev/null; then
                printf '{"diagnosticStatus":"unavailable"}\n' \
                  > "${RUNNER_TEMP}/staged-revision-diagnostics.json"
              fi
            fi
            if gcloud logging read \
              'resource.type="cloud_run_revision" AND resource.labels.service_name="cdl-react-staging-api" AND resource.labels.revision_name="'${created}'" AND severity>=ERROR' \
              --project "${PROJECT_ID}" --freshness=2h --limit=100 --format=json \
              > "${RUNNER_TEMP}/staged-revision-error-logs.json" 2>/dev/null; then
              python scripts/cloud_run_staged_revision.py sanitize-logs \
                "${RUNNER_TEMP}/staged-revision-error-logs.json" \
                > "${RUNNER_TEMP}/staged-revision-startup-errors.json" 2>/dev/null \
                || printf '{"exceptionClasses":[],"frames":[]}\n' \
                  > "${RUNNER_TEMP}/staged-revision-startup-errors.json"
            else
              printf '{"exceptionClasses":[],"frames":[]}\n' \
                > "${RUNNER_TEMP}/staged-revision-startup-errors.json"
            fi
          else
            printf '{"exceptionClasses":[],"frames":[]}\n' \
              > "${RUNNER_TEMP}/staged-revision-startup-errors.json"
          fi
          cat "${RUNNER_TEMP}/staged-revision-diagnostics.json" >&2
          cat "${RUNNER_TEMP}/staged-revision-startup-errors.json" >&2
      - name: Create rollout evidence
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "# Automatic staging rollout evidence"
            echo
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Workflow run: ${run_url}"
            echo "- Immutable image: \`${IMAGE_DIGEST_URI}\`"
            echo "- Terraform plan safety gate: passed"
            echo "- Terraform change allowlist: passed"
            echo "- Terraform apply: completed"
            echo "- Post-apply no-change plan: passed"
            echo "- Database migration job: completed"
            echo "- Official FPL refresh job: completed with non-empty normalized data"
            echo "- Deadline settlement schedule: every five minutes"
            echo "- Synthetic seed job: not executed"
            echo "- Staging health check: passed"
            echo "- Unauthenticated FPL status boundary: HTTP 401"
            echo "- Service URL: ${SERVICE_URL}"
          } > "${RUNNER_TEMP}/automatic-staging-rollout.md"

      - name: Upload rollout evidence
        uses: actions/upload-artifact@v4
        with:
          name: automatic-staging-rollout-${{ github.sha }}
          path: |
            ${{ runner.temp }}/automatic-staging-rollout.md
            ${{ runner.temp }}/staging-image-reference.txt
            ${{ runner.temp }}/auto-rollout-plan.txt
            ${{ runner.temp }}/auto-rollout-plan-summary.md
            ${{ runner.temp }}/health.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove candidate revision traffic tag
        if: always() && env.CANDIDATE_TAG != ''
        run: |
          set -euo pipefail
          gcloud run services update-traffic cdl-react-staging-api \
            --project "${PROJECT_ID}" --region "${REGION}" \
            --remove-tags="${CANDIDATE_TAG}" --quiet

      - name: Record successful rollout
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Automatic staging rollout succeeded for commit \`${GITHUB_SHA}\`. Migrations and official FPL refresh completed. Service: ${SERVICE_URL}. Evidence: ${run_url}"
          gh api "repos/${GITHUB_REPOSITORY}/issues/96/comments" -f body="${body}"

      - name: Upload safe failed rollout diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-revision-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/staged-revision-diagnostics.json
            ${{ runner.temp }}/staged-revision-startup-errors.json
            ${{ runner.temp }}/staged-revision-verification-error.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Record failed rollout
        if: failure()
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Automatic staging rollout failed for commit \`${GITHUB_SHA}\`: ${run_url}"
          gh api "repos/${GITHUB_REPOSITORY}/issues/96/comments" -f body="${body}" || true
