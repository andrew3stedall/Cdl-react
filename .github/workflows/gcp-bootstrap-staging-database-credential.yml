name: GCP Bootstrap Staging Database Credential

on:
  workflow_dispatch:
    inputs:
      confirm_foundation_applied:
        description: Confirm the reviewed staging foundation has been applied
        required: true
        type: boolean
      confirmation:
        description: Type ROTATE STAGING DATABASE CREDENTIAL
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-staging-database-credential
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Rotate restricted staging database credential
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm_foundation_applied == true &&
      inputs.confirmation == 'ROTATE STAGING DATABASE CREDENTIAL'
    runs-on: ubuntu-latest
    environment: staging

    env:
      REGION: australia-southeast1
      INSTANCE_NAME: cdl-react-staging-postgres
      DATABASE_NAME: cdl_react
      DATABASE_USER: cdl_app
      DATABASE_SECRET: cdl-database-url
      CLOUD_SQL_PROXY_VERSION: "2.22.0"
      CLOUD_SQL_PROXY_SHA256: 42e73a8775bc3300b6514816cc4893f01b109a50f65aa779a451d3e4ff4c3ead
      PROJECT_ID: ${{ vars.GCP_STAGING_PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.GCP_STAGING_PROJECT_NUMBER }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}

    steps:
      - name: Check out the trusted source revision
        uses: actions/checkout@v4

      - name: Validate the staging boundary
        shell: bash
        run: |
          set -euo pipefail

          test -n "${PROJECT_ID}"
          test -n "${PROJECT_NUMBER}"
          test -n "${WORKLOAD_IDENTITY_PROVIDER}"
          test -n "${DEPLOY_SERVICE_ACCOUNT}"
          test "${PROJECT_ID}" = "cdl-react-staging-ast"
          test "${WORKLOAD_IDENTITY_PROVIDER}" = \
            "projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          test "${DEPLOY_SERVICE_ACCOUNT}" = \
            "github-deploy@${PROJECT_ID}.iam.gserviceaccount.com"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create or rotate the restricted database credential
        id: credential
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          proxy_pid=""
          admin_password=""

          cleanup() {
            local exit_status="$?"
            set +e

            if [ -n "${admin_password}" ]; then
              final_admin_password="$(openssl rand -hex 48)"
              echo "::add-mask::${final_admin_password}"
              gcloud sql users set-password postgres \
                --project="${PROJECT_ID}" \
                --instance="${INSTANCE_NAME}" \
                --password="${final_admin_password}" \
                --quiet >/dev/null 2>&1
            fi

            if [ -n "${proxy_pid}" ]; then
              kill "${proxy_pid}" >/dev/null 2>&1
              wait "${proxy_pid}" >/dev/null 2>&1
            fi

            rm -f \
              "${RUNNER_TEMP}/cloud-sql-proxy" \
              "${RUNNER_TEMP}/cloud-sql-proxy.log"
            exit "${exit_status}"
          }
          trap cleanup EXIT

          actual_project_number="$(gcloud projects describe "${PROJECT_ID}" \
            --format='value(projectNumber)')"
          test "${actual_project_number}" = "${PROJECT_NUMBER}"

          connection_name="$(gcloud sql instances describe "${INSTANCE_NAME}" \
            --project="${PROJECT_ID}" \
            --format='value(connectionName)')"
          test "${connection_name}" = \
            "${PROJECT_ID}:${REGION}:${INSTANCE_NAME}"

          database_exists="$(gcloud sql databases list \
            --project="${PROJECT_ID}" \
            --instance="${INSTANCE_NAME}" \
            --filter="name=${DATABASE_NAME}" \
            --format='value(name)')"
          test "${database_exists}" = "${DATABASE_NAME}"

          gcloud secrets describe "${DATABASE_SECRET}" \
            --project="${PROJECT_ID}" \
            --format='value(name)' >/dev/null

          proxy_base_url="https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v${CLOUD_SQL_PROXY_VERSION}"
          curl --fail --silent --show-error --location \
            "${proxy_base_url}/cloud-sql-proxy.linux.amd64" \
            --output "${RUNNER_TEMP}/cloud-sql-proxy"
          echo "${CLOUD_SQL_PROXY_SHA256}  ${RUNNER_TEMP}/cloud-sql-proxy" | \
            sha256sum --check
          chmod 700 "${RUNNER_TEMP}/cloud-sql-proxy"

          admin_password="$(openssl rand -hex 48)"
          application_password="$(openssl rand -hex 32)"
          echo "::add-mask::${admin_password}"
          echo "::add-mask::${application_password}"

          gcloud sql users set-password postgres \
            --project="${PROJECT_ID}" \
            --instance="${INSTANCE_NAME}" \
            --password="${admin_password}" \
            --quiet >/dev/null

          "${RUNNER_TEMP}/cloud-sql-proxy" \
            --address=127.0.0.1 \
            --port=5432 \
            "${connection_name}" \
            >"${RUNNER_TEMP}/cloud-sql-proxy.log" 2>&1 &
          proxy_pid="$!"

          for attempt in {1..30}; do
            if pg_isready --host=127.0.0.1 --port=5432 >/dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "Cloud SQL Auth Proxy did not become ready." >&2
              tail -n 20 "${RUNNER_TEMP}/cloud-sql-proxy.log" >&2
              exit 1
            fi
            sleep 1
          done

          PGPASSWORD="${admin_password}" psql \
            --host=127.0.0.1 \
            --port=5432 \
            --username=postgres \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --set=application_password="${application_password}" <<'SQL'
          DO $bootstrap$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'cdl_app'
            ) THEN
              CREATE ROLE cdl_app LOGIN;
            END IF;
          END
          $bootstrap$;

          REVOKE cloudsqlsuperuser FROM cdl_app;
          ALTER ROLE cdl_app WITH
            LOGIN
            PASSWORD :'application_password';
          ALTER ROLE cdl_app SET search_path = public, pg_catalog;

          REVOKE ALL ON DATABASE cdl_react FROM PUBLIC;
          GRANT CONNECT ON DATABASE cdl_react TO cdl_app;
          SQL

          PGPASSWORD="${admin_password}" psql \
            --host=127.0.0.1 \
            --port=5432 \
            --username=postgres \
            --dbname="${DATABASE_NAME}" \
            --set=ON_ERROR_STOP=1 <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE, CREATE ON SCHEMA public TO cdl_app;
          SQL

          role_boundary="$(PGPASSWORD="${admin_password}" psql \
            --host=127.0.0.1 \
            --port=5432 \
            --username=postgres \
            --dbname=postgres \
            --tuples-only \
            --no-align \
            --set=ON_ERROR_STOP=1 \
            --command="
              SELECT rolcanlogin::text || ',' ||
                     rolsuper::text || ',' ||
                     rolcreatedb::text || ',' ||
                     rolcreaterole::text || ',' ||
                     rolreplication::text || ',' ||
                     rolbypassrls::text || ',' ||
                     pg_has_role('cdl_app', 'cloudsqlsuperuser', 'member')::text
              FROM pg_catalog.pg_roles
              WHERE rolname = 'cdl_app';
            ")"
          test "${role_boundary}" = "true,false,false,false,false,false,false"

          application_identity="$(PGPASSWORD="${application_password}" psql \
            --host=127.0.0.1 \
            --port=5432 \
            --username="${DATABASE_USER}" \
            --dbname="${DATABASE_NAME}" \
            --tuples-only \
            --no-align \
            --set=ON_ERROR_STOP=1 \
            --command="SELECT current_user;")"
          test "${application_identity}" = "${DATABASE_USER}"

          database_url="postgresql+psycopg://${DATABASE_USER}:${application_password}@/${DATABASE_NAME}?host=/cloudsql/${connection_name}"
          echo "::add-mask::${database_url}"
          secret_version_resource="$(printf '%s' "${database_url}" | \
            gcloud secrets versions add "${DATABASE_SECRET}" \
              --project="${PROJECT_ID}" \
              --data-file=- \
              --format='value(name)')"
          test -n "${secret_version_resource}"
          secret_version="${secret_version_resource##*/}"
          test -n "${secret_version}"

          gcloud secrets versions describe "${secret_version}" \
            --secret="${DATABASE_SECRET}" \
            --project="${PROJECT_ID}" \
            --format='value(state)' | grep -Fxq ENABLED

          {
            echo "### Staging database credential"
            echo
            echo "- Project: \`${PROJECT_ID}\`"
            echo "- Instance: \`${INSTANCE_NAME}\`"
            echo "- Database: \`${DATABASE_NAME}\`"
            echo "- Restricted login role: \`${DATABASE_USER}\`"
            echo "- Role flags: no superuser, database creation, role creation, replication, or row-security bypass"
            echo "- Secret container: \`${DATABASE_SECRET}\`"
            echo "- Secret version: \`${secret_version_resource}\`"
            echo "- Bootstrap administrator password: rotated and discarded on workflow exit"
            echo "- Secret payload retained in workflow logs or artifacts: no"
            echo "- Production resources changed: none"
          } >> "${GITHUB_STEP_SUMMARY}"
