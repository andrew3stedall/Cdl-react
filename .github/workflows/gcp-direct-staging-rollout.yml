name: GCP Direct Staging Image Rollout

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gcp-direct-staging-rollout.yml"
  workflow_run:
    workflows:
      - GCP Auto Rollout Staging
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA whose immutable image should be deployed
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-direct-staging-rollout
  cancel-in-progress: false

env:
  REGION: australia-southeast1
  PROJECT_ID: cdl-react-staging-ast
  SERVICE_NAME: cdl-react-staging-api
  ARTIFACT_REPOSITORY: cdl-react-backend
  IMAGE_NAME: cdl-react-app

jobs:
  rollout:
    name: Deploy existing immutable image to Cloud Run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[direct-staging-rollout]') &&
      contains(github.event.head_commit.message, 'source_sha=')) ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: staging

    env:
      PROJECT_NUMBER: ${{ vars.GCP_STAGING_PROJECT_NUMBER }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout trusted workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate staging identity
        run: |
          set -euo pipefail
          test "${PROJECT_ID}" = "cdl-react-staging-ast"
          test -n "${PROJECT_NUMBER}"
          test "${WORKLOAD_IDENTITY_PROVIDER}" = \
            "projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          test "${DEPLOY_SERVICE_ACCOUNT}" = \
            "github-deploy@${PROJECT_ID}.iam.gserviceaccount.com"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"

      - name: Pin serving revision before fallback repair
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" --region "${REGION}" --format=json \
            > "${RUNNER_TEMP}/pre-repair-service.json"
          revision="$(python scripts/cloud_run_staged_revision.py pin \
            "${RUNNER_TEMP}/pre-repair-service.json")"
          echo "RUNTIME_TRAFFIC_REVISION=${revision}" >> "${GITHUB_ENV}"
          echo "Pinned existing 100% serving revision ${revision} before repair."

      - name: Repair database attachment for the active staging secret
        run: |
          set -euo pipefail

          database_url="$(gcloud secrets versions access latest \
            --project "${PROJECT_ID}" \
            --secret cdl-database-url)"
          echo "::add-mask::${database_url}"

          connection_name="$(python - "${database_url}" <<'PY'
          import re
          import sys

          value = sys.argv[1]
          match = re.search(r"(?:[?&])host=/cloudsql/([^&]+)", value)
          if not match:
              raise SystemExit("The active staging database secret has no Cloud SQL socket host.")
          print(match.group(1))
          PY
          )"
          project_from_connection="${connection_name%%:*}"
          instance_name="${connection_name##*:}"

          test "${project_from_connection}" = "${PROJECT_ID}"
          state="$(gcloud sql instances describe "${instance_name}" \
            --project "${PROJECT_ID}" \
            --format='value(state)')"
          test "${state}" = "RUNNABLE"
          test "$(gcloud sql instances describe "${instance_name}" \
            --project "${PROJECT_ID}" \
            --format='value(connectionName)')" = "${connection_name}"

          cloud_sql_attached() {
            local resource_type="$1"
            local resource_name="$2"
            gcloud run "${resource_type}" describe "${resource_name}" \
              --project "${PROJECT_ID}" \
              --region "${REGION}" \
              --format=json \
              | CONNECTION_NAME="${connection_name}" python -c '
          import json
          import os
          import sys

          payload = json.load(sys.stdin)
          target = os.environ["CONNECTION_NAME"]

          def find_instances(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key == "annotations" and isinstance(child, dict):
                          annotated = child.get("run.googleapis.com/cloudsql-instances", "")
                          if isinstance(annotated, str):
                              yield from (item.strip() for item in annotated.split(",") if item.strip())
                      if key in {"instances", "cloudSql", "cloud_sql_instance"}:
                          if isinstance(child, list) and all(isinstance(item, str) for item in child):
                              yield from child
                          elif isinstance(child, dict):
                              yield from find_instances(child)
                      yield from find_instances(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from find_instances(child)

          print("true" if target in set(find_instances(payload)) else "false")
          '
          }

          echo "Attaching active staging database connection ${connection_name}."
          if [ "$(cloud_sql_attached services "${SERVICE_NAME}")" != "true" ]; then
            gcloud run services update "${SERVICE_NAME}" \
              --project "${PROJECT_ID}" \
              --region "${REGION}" \
              --add-cloudsql-instances "${connection_name}" \
              --no-traffic \
              --quiet
          fi

          for job in \
            cdl-react-staging-db-migrate \
            cdl-react-staging-synthetic-seed \
            cdl-react-staging-fpl-refresh; do
            if gcloud run jobs describe "${job}" \
              --project "${PROJECT_ID}" \
              --region "${REGION}" \
              >/dev/null 2>&1; then
              if [ "$(cloud_sql_attached jobs "${job}")" != "true" ]; then
                gcloud run jobs update "${job}" \
                  --project "${PROJECT_ID}" \
                  --region "${REGION}" \
                  --add-cloudsql-instances "${connection_name}" \
                  --quiet
              fi
            fi
          done

          echo "STAGING_DATABASE_CONNECTION=${connection_name}" >> "${GITHUB_ENV}"

      - name: Verify unchanged serving revision after repair
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" --region "${REGION}" --format=json \
            > "${RUNNER_TEMP}/post-repair-service.json"
          revision="$(python scripts/cloud_run_staged_revision.py pin \
            "${RUNNER_TEMP}/post-repair-service.json")"
          if [ "${revision}" != "${RUNTIME_TRAFFIC_REVISION}" ]; then
            echo "Serving revision changed during repair: expected ${RUNTIME_TRAFFIC_REVISION}; got ${revision}." >&2
            exit 1
          fi
          echo "Verified repair preserved serving revision ${revision} at 100% traffic."

      - name: Resolve immutable image for this rollout
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            source_sha="${{ github.event.workflow_run.head_sha }}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            source_sha="${{ inputs.source_sha }}"
          else
            source_sha="$(python - "${GITHUB_EVENT_PATH}" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as event_file:
              message = json.load(event_file).get("head_commit", {}).get("message", "")
          match = re.search(r"source_sha=([0-9a-f]{40})", message)
          if not match:
              raise SystemExit("Push deployment requires source_sha=<40-character commit SHA>")
          print(match.group(1))
          PY
            )"
          fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          image_tag_uri="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${source_sha}"
          image_digest="$(gcloud artifacts docker images describe "${image_tag_uri}" \
            --project "${PROJECT_ID}" \
            --format='value(image_summary.digest)')"
          test "${image_digest}" != "<no value>"
          test "${image_digest}" = "sha256:${image_digest#sha256:}"
          image_digest_uri="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}@${image_digest}"
          echo "IMAGE_DIGEST_URI=${image_digest_uri}" >> "${GITHUB_ENV}"
          echo "source_sha=${source_sha}"
          echo "image_digest_uri=${image_digest_uri}"

      - name: Verify immutable image exists
        run: |
          set -euo pipefail
          gcloud artifacts docker images describe "${IMAGE_DIGEST_URI}" \
            --project "${PROJECT_ID}" \
            --format='value(image_summary.digest)' | grep -Fxq "${IMAGE_DIGEST_URI##*@}"

      - name: Verify pinned serving revision before migration
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" --region "${REGION}" --format=json \
            > "${RUNNER_TEMP}/current-service.json"
          revision="$(python scripts/cloud_run_staged_revision.py pin "${RUNNER_TEMP}/current-service.json")"
          test "${revision}" = "${RUNTIME_TRAFFIC_REVISION}"
          echo "Serving revision is still pinned to ${revision}."

      - name: Run and verify migrations before changing application traffic
        run: |
          set -euo pipefail
          migration_job="cdl-react-staging-db-migrate"
          gcloud run jobs update "${migration_job}" \
            --project "${PROJECT_ID}" --region "${REGION}" \
            --image "${IMAGE_DIGEST_URI}" --quiet
          migration_image="$(gcloud run jobs describe "${migration_job}" \
            --project "${PROJECT_ID}" --region "${REGION}" \
            --format='value(spec.template.spec.template.spec.containers[0].image)')"
          test "${migration_image}" = "${IMAGE_DIGEST_URI}"
          gcloud run jobs execute "${migration_job}" \
            --project "${PROJECT_ID}" --region "${REGION}" --wait

      - name: Stage image without changing application traffic
        run: |
          set -euo pipefail
          gcloud run services update "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${IMAGE_DIGEST_URI}" \
            --no-traffic \
            --quiet

      - name: Verify staged revision and retained traffic
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" --format=json \
            > "${RUNNER_TEMP}/staged-service.json"
          STAGED_REVISION=""
          for attempt in $(seq 1 60); do
            gcloud run services describe "${SERVICE_NAME}" \
              --project "${PROJECT_ID}" --region "${REGION}" --format=json \
              > "${RUNNER_TEMP}/staged-service.json"
            ready="$(python scripts/cloud_run_staged_revision.py ready \
              "${RUNNER_TEMP}/staged-service.json" "${RUNTIME_TRAFFIC_REVISION}")"
            if [ -n "${ready}" ]; then
              gcloud run revisions describe "${ready}" \
                --project "${PROJECT_ID}" --region "${REGION}" --format=json \
                > "${RUNNER_TEMP}/staged-revision.json"
              if ! STAGED_REVISION="$(python scripts/cloud_run_staged_revision.py verify \
                "${RUNNER_TEMP}/staged-service.json" "${RUNNER_TEMP}/staged-revision.json" \
                "${RUNTIME_TRAFFIC_REVISION}" "${IMAGE_DIGEST_URI}" \
                2>"${RUNNER_TEMP}/staged-revision-verification-error.txt")"; then
                cat "${RUNNER_TEMP}/staged-revision-verification-error.txt" >&2
                exit 1
              fi
              break
            fi
            if [ "$(python scripts/cloud_run_staged_revision.py failed \
              "${RUNNER_TEMP}/staged-service.json")" = "true" ]; then
              python scripts/cloud_run_staged_revision.py diagnostics \
                "${RUNNER_TEMP}/staged-service.json" - \
                "${RUNTIME_TRAFFIC_REVISION}" "${IMAGE_DIGEST_URI}" \
                > "${RUNNER_TEMP}/staged-revision-diagnostics.json"
              cat "${RUNNER_TEMP}/staged-revision-diagnostics.json" >&2
              echo "Cloud Run reports a terminal staged revision failure." >&2
              exit 1
            fi
            if [ "$(python scripts/cloud_run_staged_revision.py reconciling \
              "${RUNNER_TEMP}/staged-service.json")" = "false" ]; then
              python scripts/cloud_run_staged_revision.py diagnostics \
                "${RUNNER_TEMP}/staged-service.json" - \
                "${RUNTIME_TRAFFIC_REVISION}" "${image}" \
                > "${RUNNER_TEMP}/staged-revision-diagnostics.json"
              cat "${RUNNER_TEMP}/staged-revision-diagnostics.json" >&2
              echo "Cloud Run reconciliation ended without a new ready revision." >&2
              exit 1
            fi
            if [ "$(python scripts/cloud_run_staged_revision.py reconciling \
              "${RUNNER_TEMP}/staged-service.json")" = "false" ]; then
              python scripts/cloud_run_staged_revision.py diagnostics \
                "${RUNNER_TEMP}/staged-service.json" - \
                "${RUNTIME_TRAFFIC_REVISION}" "${image}" \
                > "${RUNNER_TEMP}/staged-revision-diagnostics.json"
              cat "${RUNNER_TEMP}/staged-revision-diagnostics.json" >&2
              echo "Cloud Run reconciliation ended without a new ready revision." >&2
              exit 1
            fi
            sleep 5
          done
          if [ -z "${STAGED_REVISION}" ]; then
            python scripts/cloud_run_staged_revision.py diagnostics \
              "${RUNNER_TEMP}/staged-service.json" - \
              "${RUNTIME_TRAFFIC_REVISION}" "${IMAGE_DIGEST_URI}" \
              > "${RUNNER_TEMP}/staged-revision-diagnostics.json"
            cat "${RUNNER_TEMP}/staged-revision-diagnostics.json" >&2
            echo "Cloud Run did not report a new ready revision within five minutes." >&2
            exit 1
          fi
          latest_ready="${STAGED_REVISION}"
          echo "STAGED_REVISION=${latest_ready}" >> "${GITHUB_ENV}"
          echo "ready_revision=${latest_ready}"
          echo "image=${IMAGE_DIGEST_URI}"
          CANDIDATE_TAG="cdl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CANDIDATE_TAG=${CANDIDATE_TAG}" >> "${GITHUB_ENV}"
          gcloud run services update-traffic "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" --region "${REGION}" \
            --update-tags="${CANDIDATE_TAG}=${latest_ready}" --quiet
          gcloud run services describe "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" --region "${REGION}" --format=json \
            > "${RUNNER_TEMP}/candidate-service.json"
          candidate_url="$(python scripts/cloud_run_staged_revision.py candidate-url \
            "${RUNNER_TEMP}/candidate-service.json" "${latest_ready}" \
            "${RUNTIME_TRAFFIC_REVISION}" "${CANDIDATE_TAG}")"
          test -n "${candidate_url}"
          curl --fail --silent --show-error "${candidate_url}/health" \
            | grep -Fq '"status":"ok"'
          status_code="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' "${candidate_url}/api/fpl/status")"
          test "${status_code}" = "401"

      - name: Promote staged revision after migration smoke checks
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" --region "${REGION}" \
            --to-revisions "${STAGED_REVISION}=100" --quiet

      - name: Verify promoted revision health and auth boundary
        run: |
          set -euo pipefail
          service_url="$(gcloud run services describe "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" --region "${REGION}" \
            --format='value(status.url)')"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "${service_url}/health" \
              | grep -Fq '"status":"ok"'; then
              break
            fi
            if [ "${attempt}" -eq 20 ]; then
              echo "Staging health endpoint did not become ready." >&2
              exit 1
            fi
            sleep 5
          done

          status_code="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            "${service_url}/api/fpl/status")"
          test "${status_code}" = "401"

      - name: Capture safe staged revision diagnostics
        if: always()
        run: |
          set -euo pipefail
          service_json="${RUNNER_TEMP}/staged-service.json"
          revision_json="${RUNNER_TEMP}/staged-revision.json"
          [ -f "${service_json}" ] || printf '{}\n' > "${service_json}"
          [ -f "${revision_json}" ] || revision_json="-"
          if ! python scripts/cloud_run_staged_revision.py diagnostics \
            "${service_json}" "${revision_json}" \
            "${RUNTIME_TRAFFIC_REVISION:-}" "${IMAGE_DIGEST_URI}" \
            > "${RUNNER_TEMP}/staged-revision-diagnostics.json" 2>/dev/null; then
            printf '{"diagnosticStatus":"unavailable"}\n' \
              > "${RUNNER_TEMP}/staged-revision-diagnostics.json"
          fi
          created="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("latestCreatedRevision") or "")' \
            "${RUNNER_TEMP}/staged-revision-diagnostics.json")"
          if [ -n "${created}" ] && [ "${created}" != "${RUNTIME_TRAFFIC_REVISION:-}" ]; then
            if gcloud run revisions describe "${created}" \
              --project "${PROJECT_ID}" --region "${REGION}" --format=json \
              > "${RUNNER_TEMP}/created-revision.json" 2>/dev/null; then
              if ! python scripts/cloud_run_staged_revision.py diagnostics \
                "${service_json}" "${RUNNER_TEMP}/created-revision.json" \
                "${RUNTIME_TRAFFIC_REVISION:-}" "${IMAGE_DIGEST_URI}" \
                > "${RUNNER_TEMP}/staged-revision-diagnostics.json" 2>/dev/null; then
                printf '{"diagnosticStatus":"unavailable"}\n' \
                  > "${RUNNER_TEMP}/staged-revision-diagnostics.json"
              fi
            fi
            if gcloud logging read \
              'resource.type="cloud_run_revision" AND resource.labels.service_name="'${SERVICE_NAME}'" AND resource.labels.revision_name="'${created}'" AND severity>=ERROR' \
              --project "${PROJECT_ID}" --freshness=2h --limit=100 --format=json \
              > "${RUNNER_TEMP}/staged-revision-error-logs.json" 2>/dev/null; then
              python scripts/cloud_run_staged_revision.py sanitize-logs \
                "${RUNNER_TEMP}/staged-revision-error-logs.json" \
                > "${RUNNER_TEMP}/staged-revision-startup-errors.json" 2>/dev/null \
                || printf '{"exceptionClasses":[],"frames":[]}\n' \
                  > "${RUNNER_TEMP}/staged-revision-startup-errors.json"
            else
              printf '{"exceptionClasses":[],"frames":[]}\n' \
                > "${RUNNER_TEMP}/staged-revision-startup-errors.json"
            fi
          else
            printf '{"exceptionClasses":[],"frames":[]}\n' \
              > "${RUNNER_TEMP}/staged-revision-startup-errors.json"
          fi
          cat "${RUNNER_TEMP}/staged-revision-diagnostics.json" >&2
          cat "${RUNNER_TEMP}/staged-revision-startup-errors.json" >&2
      - name: Upload safe failed rollout diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: direct-staging-revision-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/staged-revision-diagnostics.json
            ${{ runner.temp }}/staged-revision-startup-errors.json
            ${{ runner.temp }}/staged-revision-verification-error.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Remove candidate revision traffic tag
        if: always() && env.CANDIDATE_TAG != ''
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" --region "${REGION}" \
            --remove-tags="${CANDIDATE_TAG}" --quiet
