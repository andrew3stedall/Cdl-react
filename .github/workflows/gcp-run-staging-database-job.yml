name: GCP Run Staging Database Job

on:
  push:
    branches:
      - main
    paths:
      - ".github/staging-operations/requests/*.json"
  workflow_dispatch:
    inputs:
      operation:
        description: Select the controlled database operation
        required: true
        type: choice
        options:
          - migrate
          - synthetic-seed
          - fpl-refresh
          - synthetic-fixture-cleanup
      confirm_database_jobs_applied:
        description: Confirm the reviewed database-jobs Terraform stage has been applied
        required: true
        type: boolean
      confirm_synthetic_data:
        description: Confirm synthetic data is intended; required for synthetic-seed
        required: true
        default: false
        type: boolean
      confirm_synthetic_fixture_cleanup:
        description: Confirm all rows marked synthetic in the staging fixture table should be removed
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-staging-database-operation
  cancel-in-progress: false

jobs:
  execute:
    name: Execute controlled staging database operation
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.confirm_database_jobs_applied == true)
    runs-on: ubuntu-latest
    environment: staging

    env:
      REGION: australia-southeast1
      PROJECT_ID: ${{ vars.GCP_STAGING_PROJECT_ID }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate operation and environment
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_CONFIRM_DATABASE_JOBS_APPLIED: ${{ inputs.confirm_database_jobs_applied }}
          INPUT_CONFIRM_SYNTHETIC_DATA: ${{ inputs.confirm_synthetic_data }}
          INPUT_CONFIRM_SYNTHETIC_FIXTURE_CLEANUP: ${{ inputs.confirm_synthetic_fixture_cleanup }}
        run: |
          set -euo pipefail
          test -n "${PROJECT_ID}"
          test -n "${WORKLOAD_IDENTITY_PROVIDER}"
          test -n "${DEPLOY_SERVICE_ACCOUNT}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            mapfile -t request_files < <(
              jq -r '.commits[]? | (.added[]?, .modified[]?)' "${GITHUB_EVENT_PATH}" |
                sort -u |
                grep -E '^\\.github/staging-operations/requests/[A-Za-z0-9._-]+\\.json$' || true
            )
            if [[ "${#request_files[@]}" -ne 1 ]]; then
              echo "A staging-operation push must change exactly one request JSON file." >&2
              exit 1
            fi

            request_file="${request_files[0]}"
            operation="$(jq -er '.operation | select(type == "string")' "${request_file}")"
            confirm_database_jobs_applied="$(jq -r 'if .confirm_database_jobs_applied == true then "true" else "false" end' "${request_file}")"
            confirm_synthetic_data="$(jq -r 'if .confirm_synthetic_data == true then "true" else "false" end' "${request_file}")"
            confirm_synthetic_fixture_cleanup="$(jq -r 'if .confirm_synthetic_fixture_cleanup == true then "true" else "false" end' "${request_file}")"
            echo "Processing staging operation request ${request_file}."
          else
            operation="${INPUT_OPERATION}"
            confirm_database_jobs_applied="${INPUT_CONFIRM_DATABASE_JOBS_APPLIED}"
            confirm_synthetic_data="${INPUT_CONFIRM_SYNTHETIC_DATA}"
            confirm_synthetic_fixture_cleanup="${INPUT_CONFIRM_SYNTHETIC_FIXTURE_CLEANUP}"
          fi

          if [[ "${confirm_database_jobs_applied}" != "true" ]]; then
            echo "The database-jobs Terraform stage must be applied before execution." >&2
            exit 1
          fi

          case "${operation}" in
            migrate)
              job_name="cdl-react-staging-db-migrate"
              ;;
            synthetic-seed)
              if [[ "${confirm_synthetic_data}" != "true" ]]; then
                echo "Synthetic seed execution requires explicit synthetic-data confirmation." >&2
                exit 1
              fi
              job_name="cdl-react-staging-synthetic-seed"
              ;;
            fpl-refresh)
              job_name="cdl-react-staging-fpl-refresh"
              ;;
            synthetic-fixture-cleanup)
              if [[ "${confirm_synthetic_fixture_cleanup}" != "true" ]]; then
                echo "Synthetic fixture cleanup requires explicit confirmation." >&2
                exit 1
              fi
              job_name="cdl-react-staging-synthetic-fixture-cleanup"
              ;;
            *)
              echo "Unsupported database operation." >&2
              exit 1
              ;;
          esac

          echo "JOB_NAME=${job_name}" >> "${GITHUB_ENV}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"

      - name: Verify Terraform-managed job configuration
        run: |
          set -euo pipefail
          image="$(
            gcloud run jobs describe "${JOB_NAME}" \
              --project "${PROJECT_ID}" \
              --region "${REGION}" \
              --format='value(spec.template.spec.template.spec.containers[0].image)'
          )"
          image_pattern="^${REGION}-docker\\.pkg\\.dev/${PROJECT_ID}/cdl-react-backend/cdl-react-app@sha256:[0-9a-f]{64}$"
          if [[ ! "${image}" =~ ${image_pattern} ]]; then
            echo "The configured job does not use the expected immutable staging image." >&2
            exit 1
          fi
          echo "Executing ${JOB_NAME} from immutable image ${image}."

      - name: Execute and wait for completion
        run: |
          set -euo pipefail
          gcloud run jobs execute "${JOB_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --wait
