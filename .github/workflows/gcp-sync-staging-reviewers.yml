name: GCP Sync Staging Reviewers

on:
  workflow_dispatch:
    inputs:
      google_allowed_emails:
        description: Comma-separated exact Google email allowlist for the three staging reviewers
        required: true
        type: string
      confirm_reviewer_sync:
        description: Confirm that these reviewers should access the staging synthetic league
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-staging-database-operation
  cancel-in-progress: false

jobs:
  sync:
    name: Update staging reviewer allowlist and team links
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm_reviewer_sync == true
    runs-on: ubuntu-latest
    environment: staging

    env:
      REGION: australia-southeast1
      PROJECT_ID: ${{ vars.GCP_STAGING_PROJECT_ID }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
      SYNTHETIC_SEED_JOB: cdl-react-staging-synthetic-seed
      GOOGLE_ALLOWED_EMAILS: ${{ inputs.google_allowed_emails }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Validate staging identity and reviewer count
        shell: bash
        run: |
          set -euo pipefail
          test "${PROJECT_ID}" = "cdl-react-staging-ast"
          test -n "${WORKLOAD_IDENTITY_PROVIDER}"
          test -n "${DEPLOY_SERVICE_ACCOUNT}"
          python - <<'PY'
          import os

          emails = tuple(
              email.strip().lower()
              for email in os.environ["GOOGLE_ALLOWED_EMAILS"].split(",")
              if email.strip()
          )
          if len(emails) != 3 or any("@" not in email for email in emails):
              raise SystemExit("Exactly three valid reviewer email addresses are required.")
          PY

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"

      - name: Update protected Google allowlist
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${GOOGLE_ALLOWED_EMAILS}" \
            | gcloud secrets versions add cdl-google-allowed-emails \
                --project="${PROJECT_ID}" \
                --data-file=- \
                --quiet >/dev/null

      - name: Verify Terraform-managed seed job image
        shell: bash
        run: |
          set -euo pipefail
          image="$(gcloud run jobs describe "${SYNTHETIC_SEED_JOB}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(spec.template.spec.template.spec.containers[0].image)')"
          image_pattern="^${REGION}-docker\\.pkg\\.dev/${PROJECT_ID}/cdl-react-backend/cdl-react-app@sha256:[0-9a-f]{64}$"
          if [[ ! "${image}" =~ ${image_pattern} ]]; then
            echo "The staging seed job is not using an immutable Terraform-managed image." >&2
            exit 1
          fi

      - name: Re-seed staging teams from the updated allowlist
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs execute "${SYNTHETIC_SEED_JOB}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --wait
