name: GCP Terraform Staging

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/gcp-terraform-staging.yml"
      - "src/cdl_api/terraform_plan_summary.py"
      - "src/cdl_api/terraform_plan_manifest.py"
      - "tests/test_gcp_staging_plan_workflow.py"
      - "tests/test_terraform_plan_manifest.py"
  workflow_dispatch:
    inputs:
      deployment_stage:
        description: Select the cumulative staging layer to include in this plan
        required: true
        default: foundation
        type: choice
        options:
          - foundation
          - database-jobs
          - runtime
      access_model:
        description: Keep Cloud Run private or expose it behind the staging application login
        required: true
        default: private
        type: choice
        options:
          - private
          - application-login
      backend_image:
        description: Immutable Artifact Registry digest URI for database-jobs or runtime
        required: false
        type: string
      enable_google_sign_in:
        description: Attach populated Google sign-in secrets to the application-login runtime
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-terraform-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ${{ matrix.working_directory }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        working_directory:
          - infra/terraform/bootstrap
          - infra/terraform/environments/staging

    defaults:
      run:
        working-directory: ${{ matrix.working_directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -recursive -check

      - name: Terraform init without backend
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

  authenticated-plan:
    name: Authenticated staging plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: staging

    env:
      PROJECT_ID: ${{ vars.GCP_STAGING_PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.GCP_STAGING_PROJECT_NUMBER }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
      TERRAFORM_STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
      DEPLOYMENT_STAGE: ${{ inputs.deployment_stage }}
      ACCESS_MODEL: ${{ inputs.access_model }}
      BACKEND_IMAGE: ${{ inputs.backend_image }}
      ENABLE_GOOGLE_SIGN_IN: ${{ inputs.enable_google_sign_in }}

    defaults:
      run:
        working-directory: infra/terraform/environments/staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate environment and resolve cumulative stage
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROJECT_ID}"
          test -n "${PROJECT_NUMBER}"
          test -n "${WORKLOAD_IDENTITY_PROVIDER}"
          test -n "${DEPLOY_SERVICE_ACCOUNT}"
          test -n "${TERRAFORM_STATE_BUCKET}"

          case "${DEPLOYMENT_STAGE}" in
            foundation)
              test -z "${BACKEND_IMAGE}"
              enable_database_jobs=false
              enable_cloud_run=false
              ;;
            database-jobs)
              enable_database_jobs=true
              enable_cloud_run=false
              ;;
            runtime)
              enable_database_jobs=true
              enable_cloud_run=true
              ;;
            *)
              echo "Unsupported deployment_stage: ${DEPLOYMENT_STAGE}" >&2
              exit 1
              ;;
          esac

          case "${ACCESS_MODEL}" in
            private)
              allow_public_invoker=false
              ;;
            application-login)
              test "${DEPLOYMENT_STAGE}" = "runtime"
              allow_public_invoker=true
              ;;
            *)
              echo "Unsupported access_model: ${ACCESS_MODEL}" >&2
              exit 1
              ;;
          esac

          if [ "${ENABLE_GOOGLE_SIGN_IN}" = "true" ]; then
            test "${DEPLOYMENT_STAGE}" = "runtime"
            test "${ACCESS_MODEL}" = "application-login"
          fi

          if [ "${DEPLOYMENT_STAGE}" != "foundation" ]; then
            test -n "${BACKEND_IMAGE}"
            if [[ ! "${BACKEND_IMAGE}" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "backend_image must be an immutable @sha256 digest URI." >&2
              exit 1
            fi
          fi

          echo "ENABLE_DATABASE_JOBS=${enable_database_jobs}" >> "${GITHUB_ENV}"
          echo "ENABLE_CLOUD_RUN=${enable_cloud_run}" >> "${GITHUB_ENV}"
          echo "ALLOW_PUBLIC_INVOKER=${allow_public_invoker}" >> "${GITHUB_ENV}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform init with remote backend
        run: terraform init -input=false

      - name: Create saved staging plan
        id: plan
        shell: bash
        run: |
          set +e
          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -detailed-exitcode \
            -out="${RUNNER_TEMP}/staging.tfplan" \
            -var="project_id=${PROJECT_ID}" \
            -var="enable_database_jobs=${ENABLE_DATABASE_JOBS}" \
            -var="enable_cloud_run=${ENABLE_CLOUD_RUN}" \
            -var="enable_google_sign_in=${ENABLE_GOOGLE_SIGN_IN}" \
            -var="backend_image=${BACKEND_IMAGE}" \
            -var="allow_public_invoker=${ALLOW_PUBLIC_INVOKER}"
          plan_exit_code=$?
          set -e

          if [ "${plan_exit_code}" -eq 1 ]; then
            echo "Terraform plan failed." >&2
            exit 1
          fi

          echo "exit_code=${plan_exit_code}" >> "${GITHUB_OUTPUT}"

      - name: Render reviewable plan evidence
        id: render
        shell: bash
        run: |
          set -euo pipefail
          terraform show -no-color "${RUNNER_TEMP}/staging.tfplan" \
            > "${RUNNER_TEMP}/staging-plan.txt"
          terraform show -json "${RUNNER_TEMP}/staging.tfplan" \
            > "${RUNNER_TEMP}/staging-plan.json"

      - name: Summarize and gate staging plan
        id: plan_summary
        continue-on-error: true
        shell: bash
        run: |
          summary_access_args=()
          if [ "${ALLOW_PUBLIC_INVOKER}" = "true" ]; then
            summary_access_args+=(--allow-staging-public-invoker)
          fi
          python "${GITHUB_WORKSPACE}/src/cdl_api/terraform_plan_summary.py" \
            --plan-json "${RUNNER_TEMP}/staging-plan.json" \
            --plan-file "${RUNNER_TEMP}/staging.tfplan" \
            --output "${RUNNER_TEMP}/staging-plan-summary.md" \
            --plan-exit-code "${{ steps.plan.outputs.exit_code }}" \
            "${summary_access_args[@]}"

      - name: Create immutable plan identity manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          python "${GITHUB_WORKSPACE}/src/cdl_api/terraform_plan_manifest.py" create \
            --plan-text "${RUNNER_TEMP}/staging-plan.txt" \
            --backend-config "${GITHUB_WORKSPACE}/infra/terraform/environments/staging/backend.tf" \
            --output "${RUNNER_TEMP}/staging-plan-manifest.json" \
            --source-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --deployment-stage "${DEPLOYMENT_STAGE}" \
            --project-id "${PROJECT_ID}" \
            --state-bucket "${TERRAFORM_STATE_BUCKET}" \
            --backend-image "${BACKEND_IMAGE}" \
            --enable-database-jobs "${ENABLE_DATABASE_JOBS}" \
            --enable-cloud-run "${ENABLE_CLOUD_RUN}" \
            --enable-google-sign-in "${ENABLE_GOOGLE_SIGN_IN}" \
            --allow-public-invoker "${ALLOW_PUBLIC_INVOKER}"

      - name: Remove machine-readable and executable plan files
        if: always()
        shell: bash
        run: |
          rm -f \
            "${RUNNER_TEMP}/staging.tfplan" \
            "${RUNNER_TEMP}/staging-plan.json"

      - name: Verify reviewable plan evidence completeness
        id: evidence
        if: always() && steps.render.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -s "${RUNNER_TEMP}/staging-plan.txt"
          test -s "${RUNNER_TEMP}/staging-plan-summary.md"
          test -s "${RUNNER_TEMP}/staging-plan-manifest.json"
          grep -Fq '"schema_version": "staging-terraform-plan/v1"' \
            "${RUNNER_TEMP}/staging-plan-manifest.json"
          grep -Fq "# Staging Terraform plan review" \
            "${RUNNER_TEMP}/staging-plan-summary.md"
          grep -Fq "## Detected remote-state drift" \
            "${RUNNER_TEMP}/staging-plan-summary.md"
          grep -Fq "Binary plan and machine-readable JSON: not retained or uploaded" \
            "${RUNNER_TEMP}/staging-plan-summary.md"

      - name: Upload reviewable plan evidence
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: staging-terraform-plan-${{ github.sha }}-${{ inputs.deployment_stage }}-${{ inputs.access_model }}
          path: |
            ${{ runner.temp }}/staging-plan.txt
            ${{ runner.temp }}/staging-plan-summary.md
            ${{ runner.temp }}/staging-plan-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce staging plan safety gate
        if: >-
          always() &&
          (steps.plan_summary.outcome == 'failure' ||
          steps.manifest.outcome == 'failure' ||
          steps.evidence.outcome == 'failure')
        shell: bash
        run: |
          echo "The staging plan summary failed, evidence was incomplete, or the plan was blocked." >&2
          exit 1
