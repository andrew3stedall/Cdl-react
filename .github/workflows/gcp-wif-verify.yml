name: GCP WIF Verify

on:
  workflow_dispatch:

permissions:
  id-token: write

concurrency:
  group: gcp-wif-verify
  cancel-in-progress: true

jobs:
  verify:
    name: Verify keyless staging access
    runs-on: ubuntu-latest
    environment: staging

    env:
      PROJECT_ID: ${{ vars.GCP_STAGING_PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.GCP_STAGING_PROJECT_NUMBER }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
      TERRAFORM_STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}

    steps:
      - name: Require trusted main ref
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Validate required environment variables
        run: |
          set -euo pipefail
          test -n "${PROJECT_ID}"
          test -n "${PROJECT_NUMBER}"
          test -n "${WORKLOAD_IDENTITY_PROVIDER}"
          test -n "${DEPLOY_SERVICE_ACCOUNT}"
          test -n "${TERRAFORM_STATE_BUCKET}"

          test "${WORKLOAD_IDENTITY_PROVIDER}" = \
            "projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          test "${DEPLOY_SERVICE_ACCOUNT}" = \
            "github-deploy@${PROJECT_ID}.iam.gserviceaccount.com"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"

      - name: Verify federated identity and project
        run: |
          set -euo pipefail

          active_account="$(gcloud auth list \
            --filter='status:ACTIVE' \
            --format='value(account)' \
            --limit=1)"
          test "${active_account}" = "${DEPLOY_SERVICE_ACCOUNT}"

          actual_project_number="$(gcloud projects describe "${PROJECT_ID}" \
            --format='value(projectNumber)')"
          test "${actual_project_number}" = "${PROJECT_NUMBER}"

      - name: Verify required API visibility
        run: |
          set -euo pipefail

          for service in \
            iamcredentials.googleapis.com \
            serviceusage.googleapis.com \
            storage.googleapis.com \
            sts.googleapis.com
          do
            enabled_service="$(gcloud services list \
              --enabled \
              --project="${PROJECT_ID}" \
              --filter="config.name=${service}" \
              --format='value(config.name)')"
            test "${enabled_service}" = "${service}"
          done

      - name: Verify protected Terraform state bucket boundary
        run: |
          set -euo pipefail

          bucket_json="${RUNNER_TEMP}/terraform-state-bucket.json"
          iam_json="${RUNNER_TEMP}/terraform-state-bucket-iam.json"
          trap 'rm -f "${bucket_json}" "${iam_json}"' EXIT

          gcloud storage buckets describe "gs://${TERRAFORM_STATE_BUCKET}" \
            --format=json > "${bucket_json}"
          gcloud storage buckets get-iam-policy "gs://${TERRAFORM_STATE_BUCKET}" \
            --format=json > "${iam_json}"

          python - "${bucket_json}" "${iam_json}" "${PROJECT_NUMBER}" "${DEPLOY_SERVICE_ACCOUNT}" <<'PY'
          import json
          import sys
          from pathlib import Path

          bucket = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          policy = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          expected_project_number = sys.argv[3]
          deploy_member = f"serviceAccount:{sys.argv[4]}"

          actual_project_number = str(bucket.get("projectNumber", ""))
          location = str(bucket.get("location", "")).upper()
          iam_configuration = bucket.get("iamConfiguration") or {}
          uniform_access = iam_configuration.get("uniformBucketLevelAccess") or {}
          versioning = bucket.get("versioning") or {}

          assert actual_project_number == expected_project_number
          assert location == "AUSTRALIA-SOUTHEAST1"
          assert uniform_access.get("enabled") is True
          assert iam_configuration.get("publicAccessPrevention") == "enforced"
          assert versioning.get("enabled") is True

          bindings = policy.get("bindings") or []
          public_members = {"allUsers", "allAuthenticatedUsers"}
          assert not any(public_members.intersection(binding.get("members") or []) for binding in bindings)

          object_admin_members = {
              member
              for binding in bindings
              if binding.get("role") == "roles/storage.objectAdmin"
              for member in (binding.get("members") or [])
          }
          assert object_admin_members == {deploy_member}
          PY

      - name: Create reviewable verification evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_file="${RUNNER_TEMP}/gcp-wif-verification.md"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo "# GCP Workload Identity verification"
            echo
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Workflow run: ${run_url}"
            echo "- Trusted ref: \`${GITHUB_REF}\`"
            echo "- Project: \`${PROJECT_ID}\`"
            echo "- Project number: \`${PROJECT_NUMBER}\`"
            echo "- Workload Identity provider: \`${WORKLOAD_IDENTITY_PROVIDER}\`"
            echo "- Federated account: \`${DEPLOY_SERVICE_ACCOUNT}\`"
            echo "- Terraform state bucket: \`gs://${TERRAFORM_STATE_BUCKET}\`"
            echo "- GitHub token permissions: OIDC only; repository contents unavailable"
            echo "- State bucket project boundary: confirmed"
            echo "- State bucket region: \`australia-southeast1\`"
            echo "- Uniform bucket-level access: confirmed"
            echo "- Public access prevention: enforced"
            echo "- Public IAM principals: none"
            echo "- State writer binding: exact deploy service account only"
            echo "- Object versioning: enabled"
            echo "- Raw bucket metadata and IAM policy: deleted and not retained"
            echo "- GCP resources changed: none"
          } > "${evidence_file}"

          test -s "${evidence_file}"
          grep -Fq "Source commit: \`${GITHUB_SHA}\`" "${evidence_file}"
          grep -Fq "Workload Identity provider: \`${WORKLOAD_IDENTITY_PROVIDER}\`" "${evidence_file}"
          grep -Fq "Terraform state bucket: \`gs://${TERRAFORM_STATE_BUCKET}\`" "${evidence_file}"
          grep -Fq "GitHub token permissions: OIDC only; repository contents unavailable" "${evidence_file}"
          grep -Fq "Raw bucket metadata and IAM policy: deleted and not retained" "${evidence_file}"
          cat "${evidence_file}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload reviewable verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: gcp-wif-verification-${{ github.sha }}
          path: ${{ runner.temp }}/gcp-wif-verification.md
          if-no-files-found: error
          retention-days: 7
