name: One-time staging fixture seed

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-staging-fixture-seed.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: one-time-staging-fixture-seed
  cancel-in-progress: false

jobs:
  seed:
    name: Seed reviewed staging fixtures
    runs-on: ubuntu-latest
    environment: staging
    env:
      REGION: australia-southeast1
      PROJECT_ID: ${{ vars.GCP_STAGING_PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.GCP_STAGING_PROJECT_NUMBER }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
      JOB_NAME: cdl-react-staging-synthetic-seed
    steps:
      - name: Validate staging identity
        run: |
          set -euo pipefail
          test "${PROJECT_ID}" = "cdl-react-staging-ast"
          test -n "${PROJECT_NUMBER}"
          test "${WORKLOAD_IDENTITY_PROVIDER}" = "projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          test "${DEPLOY_SERVICE_ACCOUNT}" = "github-deploy@${PROJECT_ID}.iam.gserviceaccount.com"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"

      - name: Verify Terraform-managed immutable seed job
        run: |
          set -euo pipefail
          image="$(gcloud run jobs describe "${JOB_NAME}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          image_pattern="^${REGION}-docker\\.pkg\\.dev/${PROJECT_ID}/cdl-react-backend/cdl-react-app@sha256:[0-9a-f]{64}$"
          [[ "${image}" =~ ${image_pattern} ]]

      - name: Execute reviewed synthetic fixture seed
        run: |
          set -euo pipefail
          gcloud run jobs execute "${JOB_NAME}" --project "${PROJECT_ID}" --region "${REGION}" --wait
