name: One-time staging fixture verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-staging-fixture-verify.yml"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify seeded staging fixtures
    runs-on: ubuntu-latest
    environment: staging
    env:
      PROJECT_ID: ${{ vars.GCP_STAGING_PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.GCP_STAGING_PROJECT_NUMBER }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_STAGING_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
      REGION: australia-southeast1
      JOB_NAME: cdl-react-staging-synthetic-seed
    steps:
      - name: Validate staging identity
        run: |
          set -euo pipefail
          test "${PROJECT_ID}" = "cdl-react-staging-ast"
          test -n "${PROJECT_NUMBER}"
          test "${WORKLOAD_IDENTITY_PROVIDER}" = "projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          test "${DEPLOY_SERVICE_ACCOUNT}" = "github-deploy@${PROJECT_ID}.iam.gserviceaccount.com"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"

      - name: Verify fixture seed output
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            output="$(gcloud logging read 'resource.type="cloud_run_job" AND resource.labels.job_name="cdl-react-staging-synthetic-seed" AND textPayload:"Seeded explicitly synthetic staging domains"' --project "${PROJECT_ID}" --freshness=2h --limit=20 --format='value(textPayload)' || true)"
            if printf '%s\n' "${output}" | grep -Fq 'league:35-gameweeks/140-fixtures'; then
              printf '%s\n' "${output}"
              exit 0
            fi
            sleep 10
          done
          echo "Expected 35 gameweeks / 140 fixtures seed output was not found" >&2
          exit 1
