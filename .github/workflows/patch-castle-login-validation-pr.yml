name: Apply Castle login validation patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/castle-login-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/castle-login-redesign
      - name: Patch validation files
        run: python scripts/patch_castle_login_validation.py
      - name: Commit validation updates
        run: |
          if git diff --quiet; then
            echo "Validation files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-app-interactions.mjs scripts/capture-app-screenshots.mjs tests/test_github_app_screenshots_docs.py
          git commit -m "Validate the redesigned login experience"
          git push origin HEAD:codex/castle-login-redesign
