name: Patch focused shell integration

on:
  push:
    branches:
      - codex/focused-application-shell
    paths:
      - .github/workflows/patch-focused-shell-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/focused-application-shell
          fetch-depth: 0

      - name: Integrate focused shell routes and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('frontend/src/App.tsx')
          app = app_path.read_text(encoding='utf-8')
          if app.count("setBrowserPath('/', true);") != 2:
              raise SystemExit('Expected two authenticated root navigations')
          app = app.replace("setBrowserPath('/', true);", "setBrowserPath('/dashboard', true);")

          old_default = "  let routeContent = <RulesPage categories={['squads', 'trades']} sections={featuredRules} preset={preset} />;"
          new_default = "  let routeContent = <AnalyticsDashboardPage dashboardClient={dashboardClient} />;"
          if old_default not in app:
              raise SystemExit('Default route content was not found')
          app = app.replace(old_default, new_default)

          league_marker = "  if (currentPath.startsWith('/league')) {\n"
          rules_block = "  if (currentPath.startsWith('/rules')) {\n    routeContent = <RulesPage categories={['squads', 'trades']} sections={featuredRules} preset={preset} />;\n  }\n\n"
          if rules_block not in app:
              if league_marker not in app:
                  raise SystemExit('League route marker was not found')
              app = app.replace(league_marker, rules_block + league_marker, 1)

          squad_block = "  if (currentPath.startsWith('/squad-management')) {\n    routeContent = <SquadManagementPage preset={preset} />;\n  }\n\n"
          scouting_block = "  if (currentPath.startsWith('/scouting')) {\n    routeContent = <SquadManagementPage preset={preset} />;\n  }\n\n"
          if scouting_block not in app:
              if squad_block not in app:
                  raise SystemExit('Squad route block was not found')
              app = app.replace(squad_block, squad_block + scouting_block, 1)

          mobile_prop = "        isMobileNavigationOpen={isMobileNavigationOpen}\n"
          refresh_prop = "        refreshCount={refreshCount}\n"
          if refresh_prop not in app:
              if mobile_prop not in app:
                  raise SystemExit('AppShell mobile navigation prop was not found')
              app = app.replace(mobile_prop, mobile_prop + refresh_prop, 1)

          old_children = "      >\n        <p className=\"eyebrow\">Data refreshes: {refreshCount}</p>\n        {routeContent}\n      </AppShell>"
          new_children = "      >\n        {routeContent}\n      </AppShell>"
          if old_children not in app:
              raise SystemExit('Old shell refresh content was not found')
          app = app.replace(old_children, new_children, 1)
          app_path.write_text(app, encoding='utf-8')

          squad_path = Path('frontend/src/SquadManagementPage.tsx')
          squad = squad_path.read_text(encoding='utf-8')
          old_tab = "  const [activeTab, setActiveTab] = useState<WorkspaceTab>('squad');"
          new_tab = "  const [activeTab, setActiveTab] = useState<WorkspaceTab>(() => (\n    window.location.pathname.startsWith('/scouting') ? 'players' : 'squad'\n  ));"
          if old_tab not in squad:
              raise SystemExit('Squad initial tab state was not found')
          squad_path.write_text(squad.replace(old_tab, new_tab, 1), encoding='utf-8')

          interactions_path = Path('scripts/test-app-interactions.mjs')
          interactions = interactions_path.read_text(encoding='utf-8')

          def replace_function(source: str, function_name: str, next_function_name: str, replacement: str) -> str:
              start_marker = f'async function {function_name}'
              end_marker = f'async function {next_function_name}'
              start = source.find(start_marker)
              end = source.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit(f'Could not locate {function_name}')
              return source[:start] + replacement.rstrip() + '\n\n' + source[end:]

          shell_test = r'''async function testShellAndLeagueNavigation(page, viewportName) {
            await page.goto(baseUrl + '/rules', { waitUntil: 'networkidle' });

            let primaryNavigation;
            if (viewportName === 'mobile') {
              const menuButton = page.getByRole('button', { name: 'Menu', exact: true });
              if (await menuButton.getAttribute('aria-expanded') !== 'false') {
                throw new Error('Expected the mobile menu to start collapsed');
              }
              await menuButton.click();
              if (await menuButton.getAttribute('aria-expanded') !== 'true') {
                throw new Error('Expected the mobile menu to expose aria-expanded=true after opening');
              }
              primaryNavigation = page.getByRole('navigation', { name: 'Primary navigation' });
              await primaryNavigation.waitFor({ state: 'visible' });
            } else {
              primaryNavigation = page.getByRole('navigation', { name: 'Primary navigation' });
            }

            await primaryNavigation.getByRole('link', { name: 'League', exact: true }).click();
            await expectPath(page, '/league');

            const leagueNavigation = page.getByRole('navigation', { name: 'League navigation' });
            await leagueNavigation.getByRole('link', { name: 'Fixtures', exact: true }).click();
            await expectPath(page, '/league/fixtures');
            await page.getByRole('heading', { name: 'League fixtures and results' }).waitFor();

            await leagueNavigation.getByRole('link', { name: 'Table', exact: true }).click();
            await expectPath(page, '/league/table');
            await page.getByRole('heading', { name: 'League table' }).waitFor();

            await leagueNavigation.getByRole('link', { name: 'Knockout', exact: true }).click();
            await expectPath(page, '/league/knockout');
            await page.getByRole('heading', { name: 'Knockout competition' }).waitFor();

            await leagueNavigation.getByRole('link', { name: 'Head-to-head', exact: true }).click();
            await expectPath(page, '/league/head-to-head');
            await page.getByRole('heading', { name: 'Head-to-head records' }).waitFor();
          }'''
          interactions = replace_function(
              interactions,
              'testShellAndLeagueNavigation(page, viewportName) {',
              'testUnauthenticatedGuard(page, viewportName) {',
              shell_test,
          )

          login_test = r'''async function testLoginAndLogout(page, api, viewportName) {
            await page.goto(baseUrl + '/login', { waitUntil: 'networkidle' });
            await page.getByLabel('Email').fill(authenticatedSession.user.email);
            await page.getByLabel('Password').fill('wrong-password');
            await page.getByRole('button', { name: 'Sign in' }).click();
            await expectStatus(page, 'Invalid email or password.');
            await page.getByLabel('Password').fill('browser-login-secret');
            await page.getByRole('button', { name: 'Sign in' }).click();
            await expectPath(page, '/dashboard');
            if (viewportName === 'mobile') {
              await page.getByRole('button', { name: 'Menu', exact: true }).click();
            } else {
              await page.getByLabel('Account menu for Browser Manager').click();
            }
            await page.getByRole('button', { name: 'Sign out' }).click();
            await expectPath(page, '/login');
            api.restoreSession();
          }'''
          interactions = replace_function(
              interactions,
              'testLoginAndLogout(page, api, viewportName) {',
              'testLockedTeamSelection(page) {',
              login_test,
          )
          interactions_path.write_text(interactions, encoding='utf-8')

          capture_path = Path('scripts/capture-app-screenshots.mjs')
          capture = capture_path.read_text(encoding='utf-8')
          capture = capture.replace("  ['home-rules', '/'],", "  ['overview', '/'],", 1)
          capture_path.write_text(capture, encoding='utf-8')

          contract_path = Path('tests/test_github_app_screenshots_docs.py')
          contract = contract_path.read_text(encoding='utf-8')
          shell_assertion = "    assert \"Primary navigation\" in content\n"
          new_shell_assertions = (
              shell_assertion
              + "    assert \"League navigation\" in content\n"
              + "    assert \"Account menu for Browser Manager\" in content\n"
              + "    assert \"expectPath(page, '/dashboard')\" in content\n"
          )
          if "Account menu for Browser Manager" not in contract:
              if shell_assertion not in contract:
                  raise SystemExit('Shell contract assertion was not found')
              contract = contract.replace(shell_assertion, new_shell_assertions, 1)
          contract_path.write_text(contract, encoding='utf-8')

          wiki = '''# Application Shell, Navigation, and Visual Presets

          ## Purpose

          The authenticated shell keeps global navigation deliberately small and reveals specialist tools only in the context where they are useful.

          ## Information architecture

          The desktop sidebar and mobile drawer expose four primary destinations:

          - **Overview** — dashboard and current gameweek performance.
          - **Squad** — roster management, scouting, and fixture difficulty.
          - **Team** — lineup, bench, captaincy, and chips.
          - **League** — fixtures, standings, knockout, and head-to-head records.

          Contextual navigation appears beneath the header after a primary destination is selected:

          - Squad: **My squad**, **Scouting**, **Fixture difficulty**.
          - League: **Overview**, **Fixtures**, **Table**, **Knockout**, **Head-to-head**.

          Rules are a support utility rather than a permanent primary destination.

          ## Shell behaviour

          `AppShell` provides:

          - A compact sticky desktop sidebar with four primary items.
          - A mobile sheet with primary, current-context, support, appearance, refresh, and sign-out controls.
          - A compact sticky header showing the current section and page rather than the generic “Application Shell” heading.
          - A desktop account menu containing the authenticated identity, visual preset, manual refresh count, and sign-out action.
          - A horizontally scrollable contextual navigation row that does not duplicate every subroute in the global sidebar.
          - A backdrop and explicit close control for mobile navigation.

          ## Navigation configuration

          Navigation is configured in `frontend/src/navigation.ts` through:

          - `primaryNavigationItems`
          - `contextualNavigationSections`
          - `utilityNavigationItems`

          `getContextNavigation` attaches specialist routes to the correct primary destination. `getActiveContextItem` selects the most specific nested route, preventing the League overview item from remaining active on `/league/table` or another deeper route.

          The root route is treated as the Overview alias and authenticated sign-in redirects to `/dashboard`.

          ## Visual presets

          Presets remain configured in `frontend/src/theme-presets.ts`:

          - `classic`
          - `dark`
          - `compact`

          The preset selector has moved from the global action row into the desktop account menu and mobile account panel. Preferences continue to use `GET /api/me/preferences` and `PUT /api/me/preferences`, with the documented local-storage fallback.

          ## Accessibility and responsive behaviour

          - Primary, contextual, and support navigation use separate labelled landmarks.
          - Active routes expose `aria-current="page"`.
          - The mobile menu exposes `aria-expanded` and an associated sheet ID.
          - Navigation links and account actions retain minimum touch-target sizing.
          - Contextual navigation scrolls within its own region instead of expanding the document width.
          - The mobile sheet has a backdrop, explicit close control, and labelled dialog semantics.

          ## Validation

          ```bash
          uv run pytest
          cd frontend
          npm run lint
          npm run test
          npm run build
          node ../scripts/test-app-interactions.mjs
          ```
          '''
          Path('docs/wiki/application-shell-navigation-and-presets.md').write_text(
              '\n'.join(line[10:] if line.startswith('          ') else line for line in wiki.splitlines()).strip() + '\n',
              encoding='utf-8',
          )

          changelog = '''# Focused Application Shell

          ## Summary

          Replaced the oversized all-routes shell with a focused navigation model inspired by shadcn application layouts and modern material surfaces.

          ## Changes

          - Reduced global navigation to Overview, Squad, Team, and League.
          - Moved Scouting and Fixture difficulty into Squad context.
          - Moved league formats into a dedicated contextual navigation row.
          - Moved Rules to support navigation and the desktop header utility action.
          - Replaced the generic Application Shell heading with the current section and page.
          - Removed the permanent session summary card and exposed account, appearance, refresh evidence, and sign-out through contextual account controls.
          - Added a mobile drawer with backdrop, grouped navigation, account settings, and explicit close behaviour.
          - Changed the authenticated root destination to the Overview dashboard.
          - Made `/scouting` open Squad Management directly on the Player pool tab.

          ## Validation boundary

          The change preserves existing route components, API clients, authentication checks, PostgreSQL behaviour, and visual presets. It changes shell information architecture and navigation presentation only.
          '''
          Path('docs/changelog/2026-08-06-focused-application-shell.md').write_text(
              '\n'.join(line[10:] if line.startswith('          ') else line for line in changelog.splitlines()).strip() + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit focused shell integration
        run: |
          git rm -- .github/workflows/patch-focused-shell-integration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            frontend/src/App.tsx \
            frontend/src/SquadManagementPage.tsx \
            scripts/test-app-interactions.mjs \
            scripts/capture-app-screenshots.mjs \
            tests/test_github_app_screenshots_docs.py \
            docs/wiki/application-shell-navigation-and-presets.md \
            docs/changelog/2026-08-06-focused-application-shell.md
          git commit -m "Integrate focused application shell navigation"
          git push origin HEAD:codex/focused-application-shell
