name: Patch exact login selector

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/castle-login-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/castle-login-redesign
      - name: Use an exact password field locator
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/test-app-interactions.mjs')
          content = path.read_text(encoding='utf-8')
          old = "getByLabel('Password')"
          new = "getByLabel('Password', { exact: true })"
          if old not in content:
              raise SystemExit('Password locator is already exact or missing')
          path.write_text(content.replace(old, new), encoding='utf-8')
          PY
      - name: Commit the browser locator update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-app-interactions.mjs
          git commit -m "Use exact password field browser selectors"
          git push origin HEAD:codex/castle-login-redesign
