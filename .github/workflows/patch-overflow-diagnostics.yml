name: Patch overflow diagnostics

on:
  push:
    branches:
      - codex/squad-management-workspace-redesign
    paths:
      - .github/workflows/patch-overflow-diagnostics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/squad-management-workspace-redesign
          fetch-depth: 0
      - name: Add detailed overflow evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/capture-app-screenshots.mjs')
          source = path.read_text(encoding='utf-8')
          old = '''  const overflow = await page.evaluate(() => ({
            clientWidth: document.documentElement.clientWidth,
            scrollWidth: document.documentElement.scrollWidth,
          }));

          if (overflow.scrollWidth > overflow.clientWidth + 1) {
            throw new Error(
              `${routeName} at ${viewportName} overflows horizontally: ` +
                `${overflow.scrollWidth}px content in ${overflow.clientWidth}px viewport`,
            );
          }
          '''
          new = '''  const overflow = await page.evaluate(() => {
            const clientWidth = document.documentElement.clientWidth;
            const describe = (element) => {
              const rect = element.getBoundingClientRect();
              const style = getComputedStyle(element);
              const parent = element.parentElement;
              const parentRect = parent?.getBoundingClientRect();
              return {
                tag: element.tagName.toLowerCase(),
                id: element.id,
                className: typeof element.className === 'string' ? element.className : '',
                left: Math.round(rect.left),
                right: Math.round(rect.right),
                width: Math.round(rect.width),
                overflowX: style.overflowX,
                minWidth: style.minWidth,
                parent: parent ? {
                  tag: parent.tagName.toLowerCase(),
                  className: typeof parent.className === 'string' ? parent.className : '',
                  left: Math.round(parentRect?.left ?? 0),
                  right: Math.round(parentRect?.right ?? 0),
                  clientWidth: parent.clientWidth,
                  scrollWidth: parent.scrollWidth,
                  overflowX: getComputedStyle(parent).overflowX,
                } : null,
              };
            };
            const offenders = [...document.querySelectorAll('*')]
              .filter((element) => {
                const rect = element.getBoundingClientRect();
                return rect.right > clientWidth + 1 || rect.left < -1;
              })
              .sort((left, right) => right.getBoundingClientRect().right - left.getBoundingClientRect().right)
              .slice(0, 12)
              .map(describe);
            return {
              clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
              offenders,
            };
          });

          if (overflow.scrollWidth > overflow.clientWidth + 1) {
            throw new Error(
              `${routeName} at ${viewportName} overflows horizontally: ` +
                `${overflow.scrollWidth}px content in ${overflow.clientWidth}px viewport; ` +
                `widest elements: ${JSON.stringify(overflow.offenders)}`,
            );
          }
          '''
          if new in source:
              raise SystemExit(0)
          if old not in source:
              raise SystemExit('Expected overflow assertion block was not found')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Commit diagnostics
        run: |
          if git diff --quiet -- scripts/capture-app-screenshots.mjs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- scripts/capture-app-screenshots.mjs
          git commit -m "Report widest elements on screenshot overflow"
          git push origin HEAD:codex/squad-management-workspace-redesign
