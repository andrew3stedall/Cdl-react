name: Patch squad drawer close locator

on:
  push:
    branches:
      - codex/squad-management-workspace-redesign
    paths:
      - .github/workflows/patch-squad-close-locator.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/squad-management-workspace-redesign
          fetch-depth: 0
      - name: Make drawer close locator exact
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-app-interactions.mjs')
          source = path.read_text(encoding='utf-8')
          old = "await playerDialog.getByRole('button', { name: 'Close' }).click();"
          new = "await playerDialog.getByRole('button', { name: 'Close', exact: true }).click();"
          if new in source:
              raise SystemExit(0)
          if source.count(old) != 1:
              raise SystemExit(f'Expected one close locator, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Commit locator fix
        run: |
          if git diff --quiet -- scripts/test-app-interactions.mjs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- scripts/test-app-interactions.mjs
          git commit -m "Disambiguate squad drawer close locator"
          git push origin HEAD:codex/squad-management-workspace-redesign
