name: Patch squad contrast

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/squad-pitch-list-view'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/squad-pitch-list-view
      - name: Strengthen dark-surface contrast
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/squad-management.css')
          content = path.read_text(encoding='utf-8')
          marker = '/* High-specificity dark surface contract */'
          if marker not in content:
              content += '''

          /* High-specificity dark surface contract */
          .feature-screen.squad-workspace {
            background:
              radial-gradient(circle at 12% 0%, rgb(34 211 238 / 0.11), transparent 28rem),
              linear-gradient(160deg, #071625 0%, #06111d 62%, #030a12 100%);
            color: #f8fafc;
          }

          .squad-workspace .squad-load-status {
            color: #cbd5e1;
          }

          .squad-workspace .squad-metric-card.ui-card {
            background: #0b2032;
            border-color: transparent;
            color: #f8fafc;
          }

          .squad-workspace .squad-metric-card.ui-card div > span {
            color: #cbd5e1;
          }

          .squad-workspace .squad-metric-card.ui-card div > strong {
            color: #ffffff;
          }
          '''
              path.write_text(content, encoding='utf-8')
          PY
      - name: Commit contrast correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/squad-management.css
          git commit -m "Increase squad summary contrast"
          git push origin HEAD:codex/squad-pitch-list-view
