name: Patch squad mobile overflow

on:
  push:
    branches:
      - codex/squad-management-workspace-redesign
    paths:
      - .github/workflows/patch-squad-mobile-overflow.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/squad-management-workspace-redesign
          fetch-depth: 0
      - name: Constrain squad workspace width
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/squad-management.css')
          source = path.read_text(encoding='utf-8')
          marker = '/* Mobile overflow containment */'
          addition = '''

          /* Mobile overflow containment */
          .squad-workspace,
          .squad-content-card,
          .squad-tab-panel,
          .squad-table-scroll {
            box-sizing: border-box;
            max-width: 100%;
            min-width: 0;
            width: 100%;
          }

          .squad-tab-panel {
            overflow-x: hidden;
          }

          .squad-tab-panel > * {
            min-width: 0;
          }

          .squad-table-scroll {
            display: block;
            overflow-x: auto;
            overscroll-behavior-inline: contain;
          }
          '''
          if marker not in source:
              path.write_text(source.rstrip() + addition + '\n', encoding='utf-8')
          PY
      - name: Commit overflow fix
        run: |
          if git diff --quiet -- frontend/src/squad-management.css; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- frontend/src/squad-management.css
          git commit -m "Contain squad tables on mobile"
          git push origin HEAD:codex/squad-management-workspace-redesign
