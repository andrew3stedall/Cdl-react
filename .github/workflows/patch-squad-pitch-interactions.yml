name: Patch squad pitch browser assertions

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/squad-pitch-list-view'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/squad-pitch-list-view
      - name: Update general squad browser journey
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/test-app-interactions.mjs')
          content = path.read_text(encoding='utf-8')
          old = """async function testSquadManagement(page) {
            await page.goto(`${baseUrl}/squad-management`, { waitUntil: 'networkidle' });
            await expectStatus(page, 'Exeter Gently loaded from staging PostgreSQL.');

            await page.getByRole('tab', { name: /Player pool/ }).click();
          """
          new = """async function testSquadManagement(page) {
            await page.goto(`${baseUrl}/squad-management`, { waitUntil: 'networkidle' });
            await expectStatus(page, 'Exeter Gently lineup loaded from staging PostgreSQL.');

            const pitch = page.locator('section[aria-label=\"Squad pitch\"]');
            await pitch.waitFor();
            await pitch.locator('section[aria-label=\"Bench\"]').waitFor();
            await page.getByRole('button', { name: 'List', exact: true }).click();
            await page.locator('[aria-label=\"Players table\"]').waitFor();
            await page.getByRole('button', { name: 'Pitch', exact: true }).click();
            await pitch.waitFor();

            await page.getByRole('tab', { name: /Player pool/ }).click();
          """
          if old not in content:
              raise SystemExit('Expected squad-management browser block not found')
          path.write_text(content.replace(old, new), encoding='utf-8')
          PY
      - name: Commit browser assertion update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-app-interactions.mjs
          git commit -m "Validate squad pitch and list in primary journey"
          git push origin HEAD:codex/squad-pitch-list-view
