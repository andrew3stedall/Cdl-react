name: Preferences Diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/preferences-diagnostics.yml"
      - "tests/test_postgres_preferences.py"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - name: Capture exact Ruff diff
        shell: bash
        run: |
          mkdir -p diagnostics
          uv run ruff format tests/test_postgres_preferences.py
          git diff -- tests/test_postgres_preferences.py > diagnostics/ruff.diff
      - uses: actions/upload-artifact@v4
        with:
          name: preferences-format-diagnostics
          path: diagnostics
          retention-days: 1
