name: Preferences Diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/preferences-diagnostics.yml"
      - "src/cdl_api/routers/auth.py"
      - "src/cdl_api/routers/preferences.py"
      - "tests/test_preferences_api.py"
      - "tests/test_postgres_preferences.py"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cdl
          POSTGRES_USER: cdl
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cdl -d cdl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CDL_DATABASE_URL: postgresql+psycopg://cdl@localhost:5432/cdl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run alembic upgrade head
      - name: Capture exact diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          uv run ruff format \
            src/cdl_api/routers/auth.py \
            src/cdl_api/routers/preferences.py \
            tests/test_preferences_api.py \
            tests/test_postgres_preferences.py
          git diff -- \
            src/cdl_api/routers/auth.py \
            src/cdl_api/routers/preferences.py \
            tests/test_preferences_api.py \
            tests/test_postgres_preferences.py \
            > diagnostics/ruff.diff
          uv run pytest -q \
            tests/test_preferences_api.py \
            tests/test_postgres_preferences.py \
            > diagnostics/pytest.txt 2>&1
          echo "$?" > diagnostics/pytest-exit-code.txt
      - uses: actions/upload-artifact@v4
        with:
          name: preferences-diagnostics
          path: diagnostics
          retention-days: 1
