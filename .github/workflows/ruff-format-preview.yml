name: Ruff Format Preview

on:
  pull_request:
    paths:
      - ".github/workflows/ruff-format-preview.yml"
      - "src/cdl_api/terraform_plan_summary.py"
      - "tests/test_gcp_staging_plan_workflow.py"
      - "tests/test_gcp_staging_plan_assessment_template.py"

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Format scoped files
        run: |
          uv run ruff format \
            src/cdl_api/terraform_plan_summary.py \
            tests/test_gcp_staging_plan_workflow.py \
            tests/test_gcp_staging_plan_assessment_template.py

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: ruff-formatted-drift-files
          path: |
            src/cdl_api/terraform_plan_summary.py
            tests/test_gcp_staging_plan_workflow.py
            tests/test_gcp_staging_plan_assessment_template.py
          if-no-files-found: error
          retention-days: 1
