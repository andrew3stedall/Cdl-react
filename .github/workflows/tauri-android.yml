name: Tauri Android APK

on:
  pull_request:
    paths:
      - "frontend/**"
      - "src-tauri/**"
      - "package.json"
      - ".github/workflows/tauri-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Tauri and frontend dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix frontend install --no-audit --no-fund

      - name: Initialise Android project
        run: npm run tauri:android:init -- --ci

      - name: Build staging APK
        run: npm run tauri android build -- --apk --debug --config src-tauri/tauri.staging.conf.json

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: castle-draft-league-android-debug
          path: src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14
